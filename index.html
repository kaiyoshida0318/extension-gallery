<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Extension Gallery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f7fa;
    --border: #e8e8ee;
    --border-strong: #d8d8e0;
    --text: #1f1f24;
    --text-dim: #6b6b75;
    --text-faint: #9a9aa3;
    --accent: #7c5fd9;
    --accent-hover: #6749c9;
    --accent-soft: #f0ebff;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn-bg: #fff8e1;
    --warn-text: #8a6d00;
    --success-bg: #d1fae5;
    --success-text: #065f46;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* === トップバー === */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
  }

  .logo-img {
    height: 40px;
    width: auto;
    display: block;
  }

  .logo-fallback {
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
  }

  .logo-fallback span { color: var(--accent); }

  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text-faint);
  }

  .version-badge {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 11px;
  }

  .admin-actions {
    display: none;
    align-items: center;
    gap: 8px;
  }

  .admin-actions.show { display: flex; }

  .admin-btn {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }

  .admin-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .admin-btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .admin-btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }

  .admin-btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .admin-btn-danger:hover {
    background: #b91c1c;
    border-color: #b91c1c;
    color: #fff;
  }

  .admin-btn-icon {
    padding: 6px 8px;
  }

  .admin-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* === 選択モード時の行 === */
  .row-checkbox {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .row-checkbox input {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  body.select-mode .row {
    cursor: pointer;
  }

  body.select-mode .row.selected {
    background: var(--accent-soft);
  }

  body.select-mode .row-actions {
    opacity: 0.4;
    pointer-events: none;
  }

  /* === メインコンテンツ === */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* === タブ === */
  .section-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    align-items: center;
  }

  .section-tab {
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    margin-bottom: -1px;
  }

  .section-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-count {
    display: inline-block;
    background: var(--bg-soft);
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 4px;
    line-height: 1.4;
  }

  .section-tab.active .tab-count {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .count-badge {
    margin-left: auto;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    align-self: center;
  }

  /* === 検索 === */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 240px;
    position: relative;
  }

  /* クリックでソート可能なヘッダ列 */
  .sortable {
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s;
  }

  .sortable:hover {
    color: var(--accent);
  }

  .sortable.active {
    color: var(--accent);
  }

  .sort-arrow {
    display: inline-block;
    font-size: 10px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .sortable.active .sort-arrow {
    opacity: 1;
  }

  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.5;
  }

  .search-input {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px 10px 36px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-faint); }

  /* === タグフィルター === */
  .tag-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tag-pill {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tag-pill:hover { border-color: var(--accent); color: var(--accent); }

  .tag-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* === リスト === */
  .list {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .list-header {
    display: grid;
    grid-template-columns: 56px 1fr 90px 110px 300px;
    gap: 16px;
    padding: 12px 16px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 600;
    letter-spacing: 0.05em;
    transition: grid-template-columns 0.2s;
  }

  .row {
    display: grid;
    grid-template-columns: 56px 1fr 90px 110px 300px;
    gap: 16px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s, grid-template-columns 0.2s;
    cursor: pointer;
  }

  /* 選択モード時は先頭にチェックボックス列を追加 */
  body.select-mode .list-header,
  body.select-mode .row {
    grid-template-columns: 36px 56px 1fr 90px 110px 300px;
  }

  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--bg-soft); }

  .row-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }

  .row-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .row-main { min-width: 0; padding-right: 16px; }

  .row-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .row-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 6px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .row-id {
    font-size: 10px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .row-id code {
    font-family: "SF Mono", Menlo, monospace;
    color: var(--text-dim);
    background: var(--bg-soft);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
  }

  .row-tags { display: flex; gap: 4px; flex-wrap: wrap; }

  .tag {
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
  }

  .row-version { font-size: 12px; color: var(--text-dim); }
  .row-version-num { font-weight: 600; color: var(--text); }
  .row-updated { font-size: 12px; color: var(--text-dim); }
  .row-date { font-size: 12px; color: var(--text-faint); }

  .row-actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
    flex-wrap: nowrap;
  }

  .btn {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    text-align: center;
    font-weight: 500;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }

  .btn-danger {
    background: #fff;
    border-color: var(--danger-soft);
    color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .btn-icon {
    padding: 6px 7px;
    font-size: 13px;
    min-width: 30px;
  }

  /* === モーダル === */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31, 31, 36, 0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-backdrop.show { display: flex; animation: fadeIn 0.15s; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 600px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-size: 22px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-close:hover {
    background: var(--bg-soft);
    color: var(--text);
  }

  .modal h2 {
    font-size: 18px;
    color: var(--text);
    padding-right: 32px;
    margin-bottom: 4px;
  }

  .modal-version {
    color: var(--text-faint);
    font-size: 12px;
  }

  .modal-body { padding: 20px 24px; }

  .modal-desc {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .modal-section {
    margin-bottom: 20px;
  }

  .modal-section h3 {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* インストール手順 */
  .step {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .step-num {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
  }

  .step-text { color: var(--text); font-size: 13px; line-height: 1.6; padding-top: 1px; }

  .step-text code {
    background: var(--bg-soft);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: "SF Mono", Menlo, monospace;
    border: 1px solid var(--border);
  }

  /* バージョン履歴 */
  .version-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .version-row:last-child { border-bottom: none; }

  .version-label {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    font-family: "SF Mono", Menlo, monospace;
  }

  .version-label.current {
    background: var(--success-bg);
    color: var(--success-text);
  }

  .version-date {
    font-size: 12px;
    color: var(--text-faint);
    flex: 1;
  }

  .version-notes {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* フォーム */
  .form-row {
    margin-bottom: 14px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 600;
  }

  .form-label.required::after {
    content: " *";
    color: var(--danger);
  }

  .form-input, .form-textarea {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
  }

  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }

  .form-textarea {
    resize: vertical;
    min-height: 60px;
    font-family: inherit;
  }

  .form-hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  /* PAT入力欄(目玉ボタン付き) */
  .pat-input-wrap {
    position: relative;
    width: 100%;
  }

  .pat-input-field {
    padding-right: 44px !important;
    font-family: "SF Mono", Menlo, monospace !important;
  }

  .pat-toggle-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 4px;
    line-height: 1;
    transition: background 0.15s;
  }

  .pat-toggle-btn:hover {
    background: var(--bg-soft);
  }

  /* ドロップゾーン */
  .dropzone {
    border: 2px dashed var(--border-strong);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg-soft);
  }

  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  /* ファイル選択済み状態 */
  .dropzone.loaded {
    border-color: var(--success-text);
    background: var(--success-bg);
    border-style: solid;
  }

  .dropzone.loaded .dropzone-icon {
    color: var(--success-text);
  }

  .dropzone.loaded .dropzone-text {
    color: var(--success-text);
    font-weight: 600;
  }

  .dropzone.loaded .dropzone-hint {
    color: var(--success-text);
    opacity: 0.7;
  }

  .dropzone-icon { font-size: 28px; margin-bottom: 6px; }
  .dropzone-text { font-size: 13px; color: var(--text-dim); }
  .dropzone-text strong { color: var(--accent); }

  .file-info {
    font-size: 12px;
    color: var(--success-text);
    background: var(--success-bg);
    padding: 6px 10px;
    border-radius: 6px;
    margin-top: 8px;
    display: none;
  }

  .file-info.show { display: block; }

  .file-list {
    margin-top: 10px;
  }

  .file-list-header {
    font-size: 12px;
    color: var(--success-text);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .file-list-item {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-soft);
    padding: 6px 10px;
    border-radius: 4px;
    margin-bottom: 4px;
  }

  .file-list-size {
    color: var(--text-faint);
    font-size: 11px;
  }

  .dropzone-hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    background: var(--bg-soft);
  }

  /* 空状態 */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-faint);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* === 進捗オーバーレイ === */
  .progress-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
    cursor: wait;
    user-select: none;
  }

  .progress-overlay.show { display: flex; }

  /* オーバーレイ上に被さってる時のbody全体 */
  body.busy {
    cursor: wait;
  }
  body.busy * {
    pointer-events: none !important;
  }
  body.busy .progress-overlay,
  body.busy .progress-overlay * {
    pointer-events: auto !important;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-text {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }

  .progress-sub {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* === レスポンシブ === */
  @media (max-width: 720px) {
    .topbar { padding: 12px 16px; gap: 10px; }
    .container { padding: 16px; }
    .list-header { display: none; }
    .row {
      grid-template-columns: 48px 1fr;
      gap: 12px;
      padding: 14px;
    }
    .row-icon { width: 40px; height: 40px; }
    .row-main { grid-column: 2; padding-right: 0; }
    .row-version, .row-updated, .row-actions {
      grid-column: 1 / -1;
      margin-top: 10px;
    }
    .row-version, .row-updated { margin-top: 4px; display: inline-flex; gap: 8px; }
    .row-actions { justify-content: flex-start; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="logo-header.png" alt="Extension Gallery" class="logo-img"
       onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-fallback',innerHTML:'🧩 Extension <span>Gallery</span>'}))">
  <span class="version-badge">v1.6.2</span>
  <div class="topbar-right">
    <div class="admin-actions" id="admin-actions">
      <button class="admin-btn" id="select-mode-btn">☑️ 選択</button>
      <button class="admin-btn admin-btn-danger" id="bulk-delete-btn" style="display:none;">🗑️ <span id="bulk-delete-count">0</span>件削除</button>
      <button class="admin-btn admin-btn-primary" id="add-extension-btn">+ 追加</button>
      <button class="admin-btn admin-btn-icon" id="settings-btn" title="GitHub認証">⚙️</button>
    </div>
  </div>
</div>

<div class="container">

  <div class="section-tabs">
    <button class="section-tab active" data-type="all">すべて <span class="tab-count" id="tab-count-all">0</span></button>
    <button class="section-tab" data-type="extension">拡張機能 <span class="tab-count" id="tab-count-extension">0</span></button>
    <button class="section-tab" data-type="app">アプリ <span class="tab-count" id="tab-count-app">0</span></button>
    <span class="count-badge">登録: <span id="count-total">0</span>件</span>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" class="search-input" id="search" placeholder="拡張機能名・タグで検索...">
    </div>
  </div>

  <div class="tag-filter" id="tag-filter">
    <button class="tag-pill active" data-tag="all">すべて</button>
  </div>

  <div class="list">
    <div class="list-header" id="list-header">
      <div></div>
      <div>
        <span class="sortable" data-sort-col="name">名称 / 説明 <span class="sort-arrow"></span></span>
      </div>
      <div>
        <span class="sortable" data-sort-col="version">バージョン <span class="sort-arrow"></span></span>
      </div>
      <div>
        <span class="sortable" data-sort-col="updated">更新日 <span class="sort-arrow"></span></span>
      </div>
      <div style="text-align: right;">アクション</div>
    </div>
    <div id="rows"></div>
  </div>

</div>

<!-- 共通モーダル -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" id="modal-close">×</button>
      <div id="modal-header-content"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- 進捗オーバーレイ -->
<div class="progress-overlay" id="progress-overlay">
  <div class="spinner"></div>
  <div class="progress-text" id="progress-text">処理中...</div>
  <div class="progress-sub" id="progress-sub"></div>
</div>

<script>
// ===========================================
// グローバル状態
// ===========================================
const STATE = {
  data: null,
  activeTag: 'all',
  activeType: 'all',  // 'all' / 'extension' / 'app'
  sortBy: 'updated-desc',  // ソート順
  search: '',
  isAdmin: false,
  pat: '',
  repoOwner: '',
  repoName: '',
  branch: 'main',
  busy: false,
  selectMode: false,
  selectedIds: new Set()
};

const PAT_KEY = 'ext_gallery_pat';
const SORT_KEY = 'ext_gallery_sort';

// ===========================================
// 初期化
// ===========================================
async function init() {
  detectRepo();
  detectAdminMode();
  loadPat();
  loadSort();
  await loadData();
  bindEvents();
  updateAddButtonLabel();
}

// ソート順を localStorage から復元
function loadSort() {
  const saved = localStorage.getItem(SORT_KEY);
  if (saved) STATE.sortBy = saved;
}

// ソート状態をヘッダUIに反映(アクティブ列と矢印)
function updateSortHeaderUI() {
  const [col, dir] = (STATE.sortBy || 'updated-desc').split('-');
  document.querySelectorAll('.sortable').forEach(el => {
    const isActive = el.dataset.sortCol === col;
    el.classList.toggle('active', isActive);
    const arrow = el.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = isActive ? (dir === 'asc' ? '▲' : '▼') : '';
  });
}

function detectRepo() {
  // GitHub Pagesのホスト名からowner/repo推定
  // 形式: <owner>.github.io/<repo>/
  const host = location.hostname;
  const path = location.pathname.split('/').filter(Boolean);
  const ownerMatch = host.match(/^([^.]+)\.github\.io$/);
  if (ownerMatch) {
    STATE.repoOwner = ownerMatch[1];
    STATE.repoName = path[0] || 'extension-gallery';
  } else {
    STATE.repoOwner = 'kaiyoshida0318';
    STATE.repoName = 'extension-gallery';
  }
}

function detectAdminMode() {
  STATE.isAdmin = true;
  document.getElementById('admin-actions').classList.add('show');
}

function loadPat() {
  if (!STATE.isAdmin) return;
  const pat = localStorage.getItem(PAT_KEY);
  if (pat) STATE.pat = pat.trim();
}

async function loadData() {
  try {
    const res = await fetch('extensions.json?t=' + Date.now());
    STATE.data = await res.json();
    render();
  } catch (e) {
    document.getElementById('rows').innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <p>extensions.json の読み込みに失敗しました</p>
      </div>`;
  }
}

function bindEvents() {
  document.getElementById('search').addEventListener('input', e => {
    STATE.search = e.target.value.toLowerCase();
    render();
  });

  // 列ヘッダクリックでソート
  document.querySelectorAll('.sortable').forEach(el => {
    el.addEventListener('click', () => {
      const col = el.dataset.sortCol; // 'name' / 'version' / 'updated'
      const cur = STATE.sortBy;
      let next;
      if (col === 'name') {
        next = (cur === 'name-asc') ? 'name-desc' : 'name-asc';
      } else if (col === 'version') {
        // バージョンは「新しい順」がデフォルトとして自然
        next = (cur === 'version-desc') ? 'version-asc' : 'version-desc';
      } else if (col === 'updated') {
        next = (cur === 'updated-desc') ? 'updated-asc' : 'updated-desc';
      }
      STATE.sortBy = next;
      try { localStorage.setItem(SORT_KEY, STATE.sortBy); } catch(e) {}
      updateSortHeaderUI();
      render();
    });
  });
  updateSortHeaderUI();

  document.getElementById('tag-filter').addEventListener('click', e => {
    if (!e.target.classList.contains('tag-pill')) return;
    document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    STATE.activeTag = e.target.dataset.tag;
    render();
  });

  // タブ(すべて/拡張機能/アプリ)切替
  document.querySelectorAll('.section-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      STATE.activeType = tab.dataset.type;
      // 選択モード中に切り替えたら選択もリセット
      STATE.selectedIds.clear();
      updateBulkDeleteBtn();
      // 「+ 追加」ボタンのラベルも切替
      updateAddButtonLabel();
      render();
    });
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (STATE.busy) return;
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (STATE.busy) return;
    if (e.key === 'Escape') closeModal();
  });

  // Admin events
  if (STATE.isAdmin) {
    document.getElementById('settings-btn').addEventListener('click', showSettings);
    document.getElementById('add-extension-btn').addEventListener('click', showAddExtension);
    document.getElementById('select-mode-btn').addEventListener('click', toggleSelectMode);
    document.getElementById('bulk-delete-btn').addEventListener('click', bulkDeleteSelected);
  }
}

// ===========================================
// 選択モード
// ===========================================
function toggleSelectMode() {
  STATE.selectMode = !STATE.selectMode;
  document.body.classList.toggle('select-mode', STATE.selectMode);
  document.getElementById('select-mode-btn').classList.toggle('active', STATE.selectMode);
  document.getElementById('select-mode-btn').textContent = STATE.selectMode ? '✕ 選択解除' : '☑️ 選択';

  // ヘッダーのチェックボックス用カラムを動的に追加/削除
  const header = document.getElementById('list-header');
  const existing = header.querySelector('.header-checkbox-cell');
  if (STATE.selectMode && !existing) {
    const cell = document.createElement('div');
    cell.className = 'header-checkbox-cell';
    header.insertBefore(cell, header.firstChild);
  } else if (!STATE.selectMode && existing) {
    existing.remove();
  }

  if (!STATE.selectMode) STATE.selectedIds.clear();
  updateBulkDeleteBtn();
  render();
}

function toggleSelect(id) {
  if (!STATE.selectMode) return;
  if (STATE.selectedIds.has(id)) STATE.selectedIds.delete(id);
  else STATE.selectedIds.add(id);
  updateBulkDeleteBtn();
  render();
}

// 行クリック: 選択モード中は選択切替、通常時は詳細モーダルを開く
function onRowClick(id) {
  if (STATE.selectMode) {
    toggleSelect(id);
  } else {
    showDetail(id);
  }
}

function updateBulkDeleteBtn() {
  const btn = document.getElementById('bulk-delete-btn');
  const cnt = STATE.selectedIds.size;
  if (cnt > 0 && STATE.selectMode) {
    btn.style.display = 'inline-flex';
    document.getElementById('bulk-delete-count').textContent = cnt;
  } else {
    btn.style.display = 'none';
  }
}

// 「+ 追加」ボタンのラベルをアクティブタブに応じて更新
function updateAddButtonLabel() {
  const btn = document.getElementById('add-extension-btn');
  if (!btn) return;
  if (STATE.activeType === 'extension') btn.textContent = '+ 拡張機能を追加';
  else if (STATE.activeType === 'app') btn.textContent = '+ アプリを追加';
  else btn.textContent = '+ 追加';
}

async function bulkDeleteSelected() {
  const ids = Array.from(STATE.selectedIds);
  if (ids.length === 0) return;
  const names = ids.map(id => {
    const ext = STATE.data.extensions.find(e => e.id === id);
    return ext ? ext.name : id;
  });
  if (!confirm(`以下の${ids.length}件を削除しますか?\n\n${names.join('\n')}\n\nZIPファイル・アイコンも一緒に削除されます。`)) return;
  await deleteExtensions(ids);
}

// ===========================================
// 設定モーダル(PAT管理)
// ===========================================
function showSettings() {
  const hasPat = !!STATE.pat;
  document.getElementById('modal-header-content').innerHTML = `
    <h2>⚙️ 設定</h2>
    <div class="modal-version">GitHub Personal Access Token を管理します</div>
  `;
  document.getElementById('modal-body').innerHTML = `
    <div class="form-row">
      <label class="form-label">GitHub Personal Access Token</label>
      <div class="pat-input-wrap">
        <input type="password" class="form-input pat-input-field" id="settings-pat" value="${esc(STATE.pat)}" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <button type="button" class="pat-toggle-btn" id="pat-toggle-btn" title="表示/非表示">👁️</button>
      </div>
      <div class="form-hint">
        ${hasPat ? '✓ 現在のPATが保存されています(端末内のみ)' : 'まだPATが保存されていません'}<br>
        <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--accent);">github.com/settings/tokens</a> から発行(scope: repo)
      </div>
    </div>
  `;
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-danger" onclick="clearPat()">クリア</button>
    <button class="btn" onclick="closeModal()">キャンセル</button>
    <button class="btn btn-primary" onclick="savePat()" style="flex: 1;">保存</button>
  `;
  openModal();
  // 表示切替バインド
  document.getElementById('pat-toggle-btn').addEventListener('click', togglePatVisibility);
}

function togglePatVisibility() {
  const input = document.getElementById('settings-pat');
  const btn = document.getElementById('pat-toggle-btn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
    btn.title = '非表示にする';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
    btn.title = '表示する';
  }
}

// ===========================================
// PAT管理
// ===========================================
function savePat() {
  const pat = document.getElementById('settings-pat').value.trim();
  if (!pat) {
    alert('PATを入力してください');
    return;
  }
  STATE.pat = pat;
  localStorage.setItem(PAT_KEY, pat);
  closeModal();
  alert('✓ PATを保存しました(端末内のみ)');
}

function clearPat() {
  if (!confirm('保存済みのPATを削除しますか?')) return;
  STATE.pat = '';
  localStorage.removeItem(PAT_KEY);
  closeModal();
  alert('PATをクリアしました');
}

// ===========================================
// GitHub API
// ===========================================
const GH = {
  // 401/5xxなど一時的なエラーで自動リトライするfetchラッパー
  async _fetchWithRetry(url, options, maxRetry = 3) {
    let lastErr;
    for (let i = 0; i < maxRetry; i++) {
      try {
        const res = await fetch(url, options);
        // 401 も一過性のケースがあるのでリトライ対象
        if ((res.status === 401 || res.status === 403 || res.status >= 500) && i < maxRetry - 1) {
          await new Promise(r => setTimeout(r, 800 * (i + 1)));
          continue;
        }
        return res;
      } catch (e) {
        lastErr = e;
        await new Promise(r => setTimeout(r, 800 * (i + 1)));
      }
    }
    if (lastErr) throw lastErr;
    // 最終的にリトライしきったレスポンスを返す
    return await fetch(url, options);
  },

  async getFile(path) {
    const res = await this._fetchWithRetry(
      `https://api.github.com/repos/${STATE.repoOwner}/${STATE.repoName}/contents/${path}?ref=${STATE.branch}&_=${Date.now()}`,
      { headers: this._headers(), cache: 'no-store' }
    );
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`getFile失敗: ${res.status}`);
    return await res.json();
  },

  async putFile(path, content, message, sha) {
    const body = { message, content, branch: STATE.branch };
    if (sha) body.sha = sha;
    const res = await this._fetchWithRetry(
      `https://api.github.com/repos/${STATE.repoOwner}/${STATE.repoName}/contents/${path}`,
      {
        method: 'PUT',
        headers: { ...this._headers(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (!res.ok) {
      let msg = `${res.status}`;
      try {
        const err = await res.json();
        msg = err.message || msg;
      } catch (e) {}
      throw new Error(`putFile失敗: ${msg}`);
    }
    return await res.json();
  },

  // SHA衝突したら自動でSHA取り直して再試行
  async putFileSafe(path, content, message, maxRetry = 2) {
    let lastError;
    for (let i = 0; i < maxRetry; i++) {
      try {
        const existing = await this.getFile(path);
        return await this.putFile(path, content, message, existing ? existing.sha : null);
      } catch (e) {
        lastError = e;
        // SHA不一致のみリトライ
        if (/does not match|409|422/i.test(e.message)) {
          await new Promise(r => setTimeout(r, 300));
          continue;
        }
        throw e;
      }
    }
    throw lastError;
  },

  async deleteFile(path, message, sha) {
    const res = await this._fetchWithRetry(
      `https://api.github.com/repos/${STATE.repoOwner}/${STATE.repoName}/contents/${path}`,
      {
        method: 'DELETE',
        headers: { ...this._headers(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, branch: STATE.branch, sha })
      }
    );
    if (!res.ok) {
      let msg = `${res.status}`;
      try {
        const err = await res.json();
        msg = err.message || msg;
      } catch (e) {}
      throw new Error(`deleteFile失敗: ${msg}`);
    }
    return await res.json();
  },

  // SHA衝突したら自動でSHA取り直して再試行(404は即スキップ)
  async deleteFileSafe(path, message, maxRetry = 2) {
    let lastError;
    for (let i = 0; i < maxRetry; i++) {
      try {
        const existing = await this.getFile(path);
        if (!existing) return null; // 存在しないので終了
        return await this.deleteFile(path, message, existing.sha);
      } catch (e) {
        lastError = e;
        // SHA不一致のみリトライ。404やネットワークエラーは即終了
        if (/does not match|409|422/i.test(e.message)) {
          await new Promise(r => setTimeout(r, 300));
          continue;
        }
        throw e;
      }
    }
    throw lastError;
  },

  _headers() {
    const pat = (STATE.pat || '').trim();
    return {
      'Authorization': `Bearer ${pat}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
};

// ===========================================
// 描画
// ===========================================
function render() {
  if (!STATE.data) return;
  document.getElementById('count-total').textContent = STATE.data.extensions.length;
  renderTagFilter();
  renderList();
}

function renderTagFilter() {
  const tagSet = new Set();
  STATE.data.extensions.forEach(e => (e.tags || []).forEach(t => tagSet.add(t)));
  const tagFilter = document.getElementById('tag-filter');
  // 既存のpillを保持しつつ更新
  const existingTags = new Set([...tagFilter.querySelectorAll('.tag-pill')].map(b => b.dataset.tag));
  [...tagSet].sort().forEach(tag => {
    if (existingTags.has(tag)) return;
    const btn = document.createElement('button');
    btn.className = 'tag-pill';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    tagFilter.appendChild(btn);
  });
}

// 拡張リストをソート順に並べ替え(破壊的)
function sortExtensions(list, sortBy) {
  const cmpStr = (a, b) => a.localeCompare(b, 'ja');
  const cmpVer = (a, b) => {
    const pa = (a || '0').split('.').map(n => parseInt(n, 10) || 0);
    const pb = (b || '0').split('.').map(n => parseInt(n, 10) || 0);
    const len = Math.max(pa.length, pb.length);
    for (let i = 0; i < len; i++) {
      const da = pa[i] || 0, db = pb[i] || 0;
      if (da !== db) return da - db;
    }
    return 0;
  };

  const getUpdated = (ext) => {
    const cur = currentVersion(ext);
    return cur.updated_at || '';
  };

  switch (sortBy) {
    case 'name-asc':
      list.sort((a, b) => cmpStr(a.name || '', b.name || '')); break;
    case 'name-desc':
      list.sort((a, b) => cmpStr(b.name || '', a.name || '')); break;
    case 'updated-asc':
      list.sort((a, b) => cmpStr(getUpdated(a), getUpdated(b))); break;
    case 'updated-desc':
      list.sort((a, b) => cmpStr(getUpdated(b), getUpdated(a))); break;
    case 'version-desc':
      list.sort((a, b) => cmpVer(b.current_version, a.current_version)); break;
    case 'version-asc':
      list.sort((a, b) => cmpVer(a.current_version, b.current_version)); break;
    case 'id-asc':
      list.sort((a, b) => cmpStr(a.id || '', b.id || '')); break;
  }
}

// 拡張の種別を判定するヘルパ
function getExtType(ext) {
  if (ext.file_type) return ext.file_type;
  // 古いエントリはcurrent_versionのファイル拡張子で判定
  const cur = ext.versions?.find(v => v.version === ext.current_version) || ext.versions?.[0];
  if (!cur) return 'extension';
  const fext = cur.file_ext || (cur.zip ? cur.zip.split('.').pop().toLowerCase() : 'zip');
  return fext === 'zip' ? 'extension' : 'app';
}

function renderList() {
  const list = document.getElementById('rows');

  // タブごとのカウント計算
  const countAll = STATE.data.extensions.length;
  const countExt = STATE.data.extensions.filter(e => getExtType(e) === 'extension').length;
  const countApp = STATE.data.extensions.filter(e => getExtType(e) === 'app').length;
  const tcAll = document.getElementById('tab-count-all');
  const tcExt = document.getElementById('tab-count-extension');
  const tcApp = document.getElementById('tab-count-app');
  if (tcAll) tcAll.textContent = countAll;
  if (tcExt) tcExt.textContent = countExt;
  if (tcApp) tcApp.textContent = countApp;

  const filtered = STATE.data.extensions.filter(ext => {
    const typeMatch = STATE.activeType === 'all' || getExtType(ext) === STATE.activeType;
    const tagMatch = STATE.activeTag === 'all' || (ext.tags || []).includes(STATE.activeTag);
    const searchMatch = !STATE.search ||
      ext.name.toLowerCase().includes(STATE.search) ||
      ext.description.toLowerCase().includes(STATE.search) ||
      (ext.tags || []).some(t => t.toLowerCase().includes(STATE.search));
    return typeMatch && tagMatch && searchMatch;
  });

  // ソート適用
  sortExtensions(filtered, STATE.sortBy);

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <p>該当する拡張機能がありません</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(ext => {
    const cur = currentVersion(ext);
    const selected = STATE.selectedIds.has(ext.id);
    const adminButtons = STATE.isAdmin ? `
      <button class="btn" onclick="event.stopPropagation(); showEditExtension('${esc(ext.id)}')" title="編集">編集</button>
      <button class="btn" onclick="event.stopPropagation(); showAddVersion('${esc(ext.id)}')" title="新バージョン">新バージョン</button>
      <button class="btn btn-danger" onclick="event.stopPropagation(); confirmDelete('${esc(ext.id)}')" title="削除">削除</button>
    ` : '';

    return `
      <div class="row${selected ? ' selected' : ''}" data-id="${esc(ext.id)}" onclick="onRowClick('${esc(ext.id)}')">
        ${STATE.selectMode ? `
          <div class="row-checkbox">
            <input type="checkbox" ${selected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect('${esc(ext.id)}')">
          </div>
        ` : ''}
        <div class="row-icon">
          ${ext.icon ? `<img src="${esc(ext.icon)}?v=${esc(cur.version)}" alt="" onerror="this.parentElement.textContent='🧩'">` : '🧩'}
        </div>
        <div class="row-main">
          <div class="row-name">${esc(ext.name)}</div>
          <div class="row-desc">${esc(ext.description)}</div>
          <div class="row-id">ID: <code>${esc(ext.id)}</code></div>
          <div class="row-tags">
            ${(ext.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
          </div>
        </div>
        <div class="row-version">
          <div class="row-version-num">v${esc(cur.version)}</div>
        </div>
        <div class="row-updated">
          <div class="row-date">${esc(cur.updated_at)}</div>
        </div>
        <div class="row-actions">
          <a class="btn btn-primary" href="${esc(cur.zip)}" download onclick="event.stopPropagation()">DL</a>
          ${adminButtons}
        </div>
      </div>
    `;
  }).join('');
}

function currentVersion(ext) {
  const v = ext.versions.find(v => v.version === ext.current_version);
  return v || ext.versions[0] || { version: '?', zip: '#', updated_at: '?' };
}

// ===========================================
// 詳細モーダル
// ===========================================
function showDetail(id) {
  const ext = STATE.data.extensions.find(e => e.id === id);
  if (!ext) return;
  const cur = currentVersion(ext);

  document.getElementById('modal-header-content').innerHTML = `
    <h2>${esc(ext.name)}</h2>

function bindFormEvents() {
  const dz = document.getElementById('f-dropzone');
  const fi = document.getElementById('f-zip');
  if (dz && fi) {
    dz.addEventListener('click', () => fi.click());
    fi.addEventListener('change', () => showFileList(fi));
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drag');
      if (e.dataTransfer.files.length) {
        fi.files = e.dataTransfer.files;
        showFileList(fi);
      }
    });
  }

  const idz = document.getElementById('f-icondrop');
  const ifi = document.getElementById('f-icon');
  if (idz && ifi) {
    idz.addEventListener('click', () => ifi.click());
    ifi.addEventListener('change', () => showFileInfo(ifi, 'f-iconinfo'));
    idz.addEventListener('dragover', e => { e.preventDefault(); idz.classList.add('drag'); });
    idz.addEventListener('dragleave', () => idz.classList.remove('drag'));
    idz.addEventListener('drop', e => {
      e.preventDefault();
      idz.classList.remove('drag');
      if (e.dataTransfer.files[0]) {
        ifi.files = e.dataTransfer.files;
        showFileInfo(ifi, 'f-iconinfo');
      }
    });
  }
}

function showFileInfo(input, infoId) {
  const f = input.files[0];
  const info = document.getElementById(infoId);
  // 親のドロップゾーンを探す(同じform-row内)
  const dz = input.closest('.form-row')?.querySelector('.dropzone');
  if (!f) {
    if (info) info.classList.remove('show');
    if (dz) {
      dz.classList.remove('loaded');
      resetDropzoneText(dz);
    }
    return;
  }
  if (info) {
    info.textContent = `✓ ${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
    info.classList.add('show');
  }
  if (dz) {
    dz.classList.add('loaded');
    const textEl = dz.querySelector('.dropzone-text');
    const iconEl = dz.querySelector('.dropzone-icon');
    if (iconEl) iconEl.textContent = '✓';
    if (textEl) textEl.innerHTML = `<strong>${esc(f.name)}</strong><br><span style="font-weight:400;font-size:12px;">(${(f.size / 1024).toFixed(1)} KB) — クリックで変更</span>`;
  }
}

function showFileList(input) {
  const list = document.getElementById('f-filelist');
  const dz = input.closest('.form-row')?.querySelector('.dropzone');
  if (input.files.length === 0) {
    if (list) list.innerHTML = '';
    if (dz) {
      dz.classList.remove('loaded');
      resetDropzoneText(dz);
    }
    return;
  }
  if (list) {
    let html = `<div class="file-list-header">${input.files.length}個のファイル:</div>`;
    for (const f of input.files) {
      html += `<div class="file-list-item">✓ ${esc(f.name)} <span class="file-list-size">(${(f.size / 1024).toFixed(1)} KB)</span></div>`;
    }
    list.innerHTML = html;
  }
  if (dz) {
    dz.classList.add('loaded');
    const iconEl = dz.querySelector('.dropzone-icon');
    const textEl = dz.querySelector('.dropzone-text');
    if (iconEl) iconEl.textContent = '✓';
    if (textEl) {
      const n = input.files.length;
      const firstName = input.files[0].name;
      const extra = n > 1 ? ` ほか ${n - 1}件` : '';
      textEl.innerHTML = `<strong>${esc(firstName)}${extra}</strong><br><span style="font-weight:400;font-size:12px;">クリックで変更</span>`;
    }
  }
}

// ドロップゾーンの表示を初期状態に戻す
function resetDropzoneText(dz) {
  const iconEl = dz.querySelector('.dropzone-icon');
  const textEl = dz.querySelector('.dropzone-text');
  if (iconEl) iconEl.textContent = '📦';
  if (textEl) textEl.innerHTML = `ZIPをドラッグ&ドロップ、または<strong>クリックして選択</strong>`;

// ===========================================
// 追加/編集の送信
// ===========================================
async function submitAdd() {
  const fileInput = document.getElementById('f-zip');
  const files = Array.from(fileInput.files || []);

  if (files.length === 0) { alert('ZIPファイルを選択してください'); return; }

  try {
    showProgress(`${files.length}個のファイルを処理中`, '');

    const added = [];
    const failed = [];

    for (let i = 0; i < files.length; i++) {
      const upFile = files[i];
      const prefix = `[${i + 1}/${files.length}] `;
      try {
        updateProgress(`${prefix}ファイルを解析中`, upFile.name);

        // ファイル種別ごとに解析(ZIP → manifest.json, EXE → PE parser)
        const parsed = await parseUploadFile(upFile);
        const version = parsed.version || '1.0.0';
        const ext = parsed.ext || 'zip';
        // 名称(表示用): manifestのname > ファイル名(拡張子なし)
        const baseName = parsed.name || upFile.name.replace(new RegExp('\\.' + ext + '$', 'i'), '');
        const description = parsed.description || '(説明なし)';

        // ID: ファイル名(拡張子なし)を基本に、空白だけハイフンに置換
        const baseId = filenameToId(upFile.name);

        // ID衝突回避(完全一致なら、末尾に番号を足していく)
        let id = baseId;
        let n = 2;
        while (STATE.data.extensions.find(e => e.id === id) || added.find(e => e.id === id)) {
          id = `${baseId}-${n++}`;
        }

        // ファイル本体アップロード(拡張子は元のファイルに合わせる)
        const filePath = `downloads/${id}-v${version}.${ext}`;
        updateProgress(`${prefix}ファイルアップロード中`, filePath);
        await uploadFile(filePath, upFile, `Add ${id} v${version}`);

        // アイコンアップロード
        let iconPath = '';
        if (parsed.iconBlob && parsed.iconExt) {
          iconPath = `assets/icons/${id}.${parsed.iconExt}`;
          updateProgress(`${prefix}アイコンアップロード中`, iconPath);
          const iconBase64 = await blobToBase64(parsed.iconBlob);
          await GH.putFileSafe(iconPath, iconBase64, `Add icon for ${id}`);
        }

        // 構造体を追加(jsonへの反映は最後に一括)
        const newExt = {
          id,
          name: baseName,
          description,
          long_description: description,
          tags: [],
          icon: iconPath,
          author: 'Kai',
          permissions_summary: parsed.permissions_summary || '',
          file_type: parsed.file_type || 'extension',
          current_version: version,
          versions: [{
            version,
            zip: filePath,
            file_ext: ext,
            updated_at: today(),
            notes: '初回追加'
          }]
        };
        added.push(newExt);
      } catch (err) {
        console.warn('処理失敗(続行):', upFile.name, err.message);
        failed.push({ file: upFile.name, error: err.message });
      }
    }

    // extensions.jsonを一括更新
    if (added.length > 0) {
      updateProgress('extensions.jsonを更新中', `${added.length}件追加`);
      for (const ext of added) STATE.data.extensions.push(ext);
      const msg = added.length === 1
        ? `Add extension: ${added[0].id} v${added[0].current_version}`
        : `Add ${added.length} extensions`;
      await saveJson(msg);
    }

    // 反映待ち(extensions.jsonの中身で確認)
    if (added.length > 0) {
      const addedIds = added.map(e => e.id);
      await waitForExtensionPublished(addedIds, 120);
    }

    updateProgress('完了 - サイトを再読込中...', '');
    let msg = `✓ ${added.length}個の拡張機能を追加しました!`;
    if (failed.length > 0) {
      msg += `\n\n失敗 ${failed.length}件:\n` + failed.map(f => `- ${f.file}: ${f.error}`).join('\n');
    }
    msg += '\n\nOKを押すとサイトを再読込します。';
    alert(msg);
    // キャッシュバスター付きでリロード
    location.href = location.pathname + '?_=' + Date.now();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

// サポートするファイル拡張子
const SUPPORTED_EXTENSIONS = ['zip', 'exe', 'msi', 'dmg', 'pkg', 'apk', 'app', 'deb', 'rpm', 'appimage'];

// ファイル名から拡張子を取得(小文字)
function getFileExt(filename) {
  const m = filename.match(/\.([^.]+)$/);
  return m ? m[1].toLowerCase() : '';
}

// ファイル名からIDを生成(拡張子を除去、空白をハイフンに)
// 例: "My Tool.zip" → "My-Tool"
// 例: "RMS-Login-AutoFill-v1.3.0.zip" → "RMS-Login-AutoFill-v1.3.0"
// 例: "MyApp.exe" → "MyApp"
function filenameToId(filename) {
  const extRegex = new RegExp('\\.(' + SUPPORTED_EXTENSIONS.join('|') + ')$', 'i');
  let id = filename
    .replace(extRegex, '')
    .replace(/[\s\u3000]+/g, '-')
    .replace(/[\\\/]/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
  if (!id) id = 'ext-' + Date.now().toString(36);
  return id;
}

// ファイル名からバージョンを検出
// 例: "MyApp-v1.2.3.exe" → "1.2.3"
// 例: "installer_2.0.1.msi" → "2.0.1"
function extractVersionFromFilename(filename) {
  const patterns = [
    /[-_ ]v?(\d+\.\d+\.\d+(?:\.\d+)?)/i,
    /[-_ ]v?(\d+\.\d+)/i,
  ];
  for (const p of patterns) {
    const m = filename.match(p);
    if (m) return m[1];
  }
  return '';
}

// 名称をIDに変換(古い処理。manifest.short_name用に残してある)
// 例: "RMS Login" → "rms-login"
// 例: "楽天商品画像DL" → "dl-1779..." (英数残らない場合はタイムスタンプで補完)
function nameToId(name) {
  if (!name) return '';
  // 英数字・空白・ハイフンだけを残す
  let id = name.toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')   // 英数・空白・ハイフン以外を除去
    .replace(/\s+/g, '-')           // 空白→ハイフン
    .replace(/-+/g, '-')            // 連続ハイフンを1つに
    .replace(/^-|-$/g, '')          // 前後のハイフン除去
    .substring(0, 40);

    // 英数が3文字未満ならフォールバック
  if (id.length < 3) {
    // 残ったものを前にしてタイムスタンプで補完
    const ts = Date.now().toString(36).substring(0, 6);
    id = id ? `${id}-${ts}` : `ext-${ts}`;
  }
  return id;
}

// アップロードされたファイル(ZIP/EXE/その他)からメタ情報とアイコンを抽出
async function parseUploadFile(file) {
  const ext = getFileExt(file.name);
  const result = {
    id: '', name: '', version: '', description: '',
    iconBlob: null, iconExt: '', permissions_summary: '',
    file_type: 'app', // 'extension' or 'app'
    ext: ext
  };

  if (ext === 'zip') {
    return await parseExtensionZip(file, result);
  } else if (ext === 'exe') {
    return await parseExeFile(file, result);
  } else {
    // その他(msi/dmg/apkなど): ファイル名からバージョンだけ検出
    result.version = extractVersionFromFilename(file.name) || '1.0.0';
    result.description = `${ext.toUpperCase()}形式のアプリケーション`;
    return result;
  }
}

// ZIPからmanifest.jsonとアイコンを抽出
async function parseExtensionZip(zipFile, result) {
  result = result || { id: '', name: '', version: '', description: '', iconBlob: null, iconExt: '', permissions_summary: '', file_type: 'extension', ext: 'zip' };
  result.file_type = 'extension';
  try {
    const zip = await JSZip.loadAsync(zipFile);

    let manifestEntry = zip.file('manifest.json');
    let manifestPrefix = '';
    if (!manifestEntry) {
      const manifests = Object.keys(zip.files).filter(p => p.endsWith('/manifest.json') || p === 'manifest.json');
      if (manifests.length > 0) {
        manifestEntry = zip.file(manifests[0]);
        manifestPrefix = manifests[0].replace(/manifest\.json$/, '');
      }
    }

    if (manifestEntry) {
      const manifestText = await manifestEntry.async('string');
      const manifest = JSON.parse(manifestText);
      result.version = manifest.version || '';
      result.description = manifest.description || '';
      result.name = manifest.name || '';
      if (manifest.short_name) result.id = nameToId(manifest.short_name);

      if (manifest.permissions || manifest.host_permissions) {
        const all = [...(manifest.permissions || []), ...(manifest.host_permissions || [])];
        result.permissions_summary = all.slice(0, 3).join(', ');
      }

      if (manifest.icons) {
        const sizes = Object.keys(manifest.icons).map(Number).sort((a, b) => b - a);
        for (const size of sizes) {
          const iconRelPath = manifest.icons[String(size)];
          const iconFullPath = manifestPrefix + iconRelPath;
          const iconEntry = zip.file(iconFullPath);
          if (iconEntry) {
            result.iconBlob = await iconEntry.async('blob');
            const iext = iconRelPath.split('.').pop().toLowerCase();
            result.iconExt = (iext === 'jpg' ? 'jpeg' : iext);
            break;
          }
        }
      }
    } else {
      // manifest.jsonが無いZIPはアプリ扱い
      result.file_type = 'app';
      result.version = extractVersionFromFilename(zipFile.name) || '1.0.0';
    }
  } catch (e) {
    console.warn('ZIP解析エラー(続行):', e.message);
  }
  return result;
}

// EXEファイルからアイコンリソースを抽出(Windows PE形式)
async function parseExeFile(exeFile, result) {
  result = result || { id: '', name: '', version: '', description: '', iconBlob: null, iconExt: '', permissions_summary: '', file_type: 'app', ext: 'exe' };
  result.file_type = 'app';
  result.version = extractVersionFromFilename(exeFile.name) || '1.0.0';
  result.description = 'Windowsアプリケーション';

  try {
    const buffer = await exeFile.arrayBuffer();
    const icon = extractIconFromPE(buffer);
    if (icon) {
      result.iconBlob = icon.blob;
      result.iconExt = icon.ext;
    }
  } catch (e) {
    console.warn('EXE解析エラー(続行):', e.message);
  }
  return result;
}

// PE形式のバイナリからアイコンリソースを取り出す
function extractIconFromPE(buffer) {
  const view = new DataView(buffer);
  try {
    if (view.getUint16(0, true) !== 0x5A4D) return null; // "MZ"
    const peOffset = view.getUint32(0x3c, true);
    if (view.getUint32(peOffset, true) !== 0x00004550) return null; // "PE\0\0"

    const coffOffset = peOffset + 4;
    const numberOfSections = view.getUint16(coffOffset + 2, true);
    const sizeOfOptionalHeader = view.getUint16(coffOffset + 16, true);
    const optionalHeaderOffset = coffOffset + 20;
    const magic = view.getUint16(optionalHeaderOffset, true);
    const is64 = magic === 0x20B;
    const dataDirOffset = optionalHeaderOffset + (is64 ? 112 : 96);
    const resourceDirRVA = view.getUint32(dataDirOffset + 2 * 8, true);
    if (!resourceDirRVA) return null;

    const sectionHeadersOffset = optionalHeaderOffset + sizeOfOptionalHeader;
    const sections = [];
    for (let i = 0; i < numberOfSections; i++) {
      const off = sectionHeadersOffset + i * 40;
      sections.push({
        virtualSize: view.getUint32(off + 8, true),
        virtualAddress: view.getUint32(off + 12, true),
        pointerToRawData: view.getUint32(off + 20, true),
        sizeOfRawData: view.getUint32(off + 16, true),
      });
    }
    const rvaToOffset = (rva) => {
      for (const s of sections) {
        if (rva >= s.virtualAddress && rva < s.virtualAddress + Math.max(s.virtualSize, s.sizeOfRawData)) {
          return s.pointerToRawData + (rva - s.virtualAddress);
        }
      }
      return -1;
    };

    const resourceOffset = rvaToOffset(resourceDirRVA);
    if (resourceOffset < 0) return null;

    const parseResourceDir = (offset) => {
      const namedEntries = view.getUint16(offset + 12, true);
      const idEntries = view.getUint16(offset + 14, true);
      const total = namedEntries + idEntries;
      const results = [];
      for (let i = 0; i < total; i++) {
        const entryOff = offset + 16 + i * 8;
        const id = view.getUint32(entryOff, true);
        const dataOff = view.getUint32(entryOff + 4, true);
        results.push({ id, dataOff: dataOff & 0x7FFFFFFF, isDir: (dataOff & 0x80000000) !== 0 });
      }
      return results;
    };

    const level1 = parseResourceDir(resourceOffset);
    const iconGroupEntry = level1.find(e => e.id === 14 && e.isDir);
    if (!iconGroupEntry) return null;

    const level2 = parseResourceDir(resourceOffset + iconGroupEntry.dataOff);
    if (level2.length === 0 || !level2[0].isDir) return null;

    const level3 = parseResourceDir(resourceOffset + level2[0].dataOff);
    if (level3.length === 0 || level3[0].isDir) return null;

    const dataEntryOff = resourceOffset + level3[0].dataOff;
    const iconGroupRVA = view.getUint32(dataEntryOff, true);
    const iconGroupOff = rvaToOffset(iconGroupRVA);
    if (iconGroupOff < 0) return null;

    const count = view.getUint16(iconGroupOff + 4, true);
    if (count === 0) return null;

    const icons = [];
    for (let i = 0; i < count; i++) {
      const entryOff = iconGroupOff + 6 + i * 14;
      const w = view.getUint8(entryOff);
      const h = view.getUint8(entryOff + 1);
      icons.push({
        width: w === 0 ? 256 : w,
        height: h === 0 ? 256 : h,
        bitsPerPixel: view.getUint16(entryOff + 6, true),
        dataSize: view.getUint32(entryOff + 8, true),
        iconId: view.getUint16(entryOff + 12, true),
      });
    }
    let bestIdx = 0, bestScore = 0;
    icons.forEach((ic, i) => {
      const score = ic.width * ic.height * (ic.bitsPerPixel || 32);
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    });
    const bestIcon = icons[bestIdx];

    const iconTypeEntry = level1.find(e => e.id === 3 && e.isDir);
    if (!iconTypeEntry) return null;
    const iconLevel2 = parseResourceDir(resourceOffset + iconTypeEntry.dataOff);
    const iconIdEntry = iconLevel2.find(e => e.id === bestIcon.iconId && e.isDir);
    if (!iconIdEntry) return null;
    const iconLevel3 = parseResourceDir(resourceOffset + iconIdEntry.dataOff);
    if (iconLevel3.length === 0 || iconLevel3[0].isDir) return null;

    const iconDataEntryOff = resourceOffset + iconLevel3[0].dataOff;
    const iconDataRVA = view.getUint32(iconDataEntryOff, true);
    const iconDataSize = view.getUint32(iconDataEntryOff + 4, true);
    const iconDataOff = rvaToOffset(iconDataRVA);
    if (iconDataOff < 0) return null;

    // PNG形式か確認
    const sig = view.getUint32(iconDataOff, false);
    if (sig === 0x89504E47) {
      const blob = new Blob([new Uint8Array(buffer, iconDataOff, iconDataSize)], { type: 'image/png' });
      return { blob, ext: 'png' };
    }

    // BMP DIB形式 → ICOラッパーで包む
    const icoHeader = new ArrayBuffer(22);
    const icoView = new DataView(icoHeader);
    icoView.setUint16(0, 0, true);
    icoView.setUint16(2, 1, true);
    icoView.setUint16(4, 1, true);
    icoView.setUint8(6, bestIcon.width === 256 ? 0 : bestIcon.width);
    icoView.setUint8(7, bestIcon.height === 256 ? 0 : bestIcon.height);
    icoView.setUint8(8, 0);
    icoView.setUint8(9, 0);
    icoView.setUint16(10, 1, true);
    icoView.setUint16(12, bestIcon.bitsPerPixel, true);
    icoView.setUint32(14, iconDataSize, true);
    icoView.setUint32(18, 22, true);

    const iconBytes = new Uint8Array(buffer, iconDataOff, iconDataSize);
    const combined = new Uint8Array(22 + iconDataSize);
    combined.set(new Uint8Array(icoHeader), 0);
    combined.set(iconBytes, 22);
    return { blob: new Blob([combined], { type: 'image/x-icon' }), ext: 'ico' };
  } catch (e) {
    console.warn('PE解析エラー:', e.message);
    return null;
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function submitEdit(id) {
  const data = readForm(true);
  if (!data) return;

  const ext = STATE.data.extensions.find(e => e.id === id);
  if (!ext) return;

  try {
    showProgress('メタ情報を更新中', '');
    ext.name = data.name;
    ext.description = data.description;
    ext.long_description = data.long_description;
    ext.tags = data.tags;
    ext.permissions_summary = data.permissions_summary;
    await saveJson(`Edit metadata: ${id}`);

    // 反映待ち(編集の場合は単純にビルド待ち、20秒程度)
    await new Promise(r => setTimeout(r, 15000));

    updateProgress('完了 - サイトを再読込中...', '');
    alert('✓ 更新完了!\nOKを押すとサイトを再読込します。');
    location.href = location.pathname + "?_=" + Date.now();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

async function submitNewVersion(id) {
  const notes = document.getElementById('f-notes').value.trim();
  const upFile = document.getElementById('f-zip').files[0];

  if (!upFile) { alert('ファイルを選択してください'); return; }

  const ext = STATE.data.extensions.find(e => e.id === id);
  if (!ext) return;

  // ファイル名(拡張子なし)が、この拡張のIDと一致するか確認
  const fileBase = filenameToId(upFile.name);
  if (fileBase !== id && !fileBase.startsWith(id + '-')) {
    if (!confirm(`⚠️ ファイル名と拡張IDが一致しません。\n\n拡張ID: ${id}\nファイル名: ${upFile.name}\n\n別の拡張のファイルを誤ってアップロードしようとしている可能性があります。\nこのまま続けると、${id} のバージョンとして登録されます。\n\n本当に続行しますか?`)) {
      return;
    }
  }

  try {
    showProgress('ファイルを解析中', upFile.name);

    // ファイル種別に応じて解析
    const parsed = await parseUploadFile(upFile);
    const fileExt = parsed.ext || 'zip';
    let version = parsed.version || '';
    if (!version) {
      // ZIPかつmanifest.jsonからversion取れず → エラー
      if (fileExt === 'zip') {
        hideProgress();
        alert('ZIP内のmanifest.jsonからバージョン番号を取得できませんでした。\nmanifest.jsonに "version" フィールドがあるか確認してください。');
        return;
      }
      // その他はデフォルト
      version = '1.0.0';
    }

    // 既存バージョンチェック
    if (ext.versions.find(v => v.version === version)) {
      hideProgress();
      alert(`v${version} は既に存在します。バージョン番号を上げて再度アップロードしてください。`);
      return;
    }

    updateProgress('新バージョンをアップロード中', `v${version}`);
    const filePath = `downloads/${id}-v${version}.${fileExt}`;
    await uploadFile(filePath, upFile, `Add ${id} v${version}`);

    // 新しいアイコンが取れていれば、それも上書きアップロード
    let iconPath = ext.icon || '';
    if (parsed.iconBlob && parsed.iconExt) {
      const newIconPath = `assets/icons/${id}.${parsed.iconExt}`;
      updateProgress('アイコンを更新中', newIconPath);
      const iconBase64 = await blobToBase64(parsed.iconBlob);
      await GH.putFileSafe(newIconPath, iconBase64, `Update icon for ${id} v${version}`);

      // 旧アイコンが別拡張子だったら削除
      if (ext.icon && ext.icon !== newIconPath) {
        try {
          await GH.deleteFileSafe(ext.icon, `Delete old icon for ${id}`);
        } catch (e) { console.warn('旧アイコン削除失敗(続行):', e.message); }
      }
      iconPath = newIconPath;
      ext.icon = newIconPath;
    }

    updateProgress('extensions.jsonを更新中', '');
    ext.versions.unshift({
      version,
      zip: filePath,
      file_ext: fileExt,
      updated_at: today(),
      notes
    });
    ext.current_version = version;
    await saveJson(`Bump ${id} to v${version}`);

    // 反映待ち
    await waitForExtensionPublished([id], 120);

    updateProgress('完了 - サイトを再読込中...', `v${version}`);
    alert(`✓ v${version} 追加完了!\nOKを押すとサイトを再読込します。`);
    location.href = location.pathname + "?_=" + Date.now();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

function readForm(isEdit) {
  const id = (document.getElementById('f-id').value || '').trim();
  const name = document.getElementById('f-name').value.trim();
  const description = document.getElementById('f-desc').value.trim();
  if (!id || !name || !description) {
    alert('ID・名称・説明は必須です');
    return null;
  }
  if (!/^[a-z0-9-]+$/.test(id)) {
    alert('IDは英小文字・数字・ハイフンのみ');
    return null;
  }
  const data = {
    id, name, description,
    long_description: document.getElementById('f-longdesc').value.trim(),
    tags: document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean),
    permissions_summary: document.getElementById('f-perms').value.trim()
  };
  if (!isEdit) {
    data.version = document.getElementById('f-version').value.trim();
    if (!data.version) { alert('バージョン番号は必須'); return null; }
  }
  return data;
}

// ===========================================
// 削除
// ===========================================
// 単発削除(従来のボタンから)
async function confirmDelete(id) {
  if (!requirePat()) return;
  const ext = STATE.data.extensions.find(e => e.id === id);
  if (!ext) return;
  if (!confirm(`「${ext.name}」を削除しますか?\nZIPファイル・アイコンも一緒に削除されます。`)) return;
  await deleteExtensions([id]);
}

// 複数削除(共通処理)
async function deleteExtensions(ids) {
  if (!requirePat()) return;
  if (ids.length === 0) return;

  try {
    const targets = ids.map(id => STATE.data.extensions.find(e => e.id === id)).filter(Boolean);
    if (targets.length === 0) return;

    showProgress(`${targets.length}件削除中`, targets.map(t => t.name).join(', '));

    // 削除対象URL(後で「消えたか」を確認するため)
    const checkUrls = [];

    // ZIP・アイコンを全て並列削除
    const deletions = [];
    for (const ext of targets) {
      for (const v of ext.versions) {
        deletions.push(
          GH.deleteFileSafe(v.zip, `Delete ${v.zip}`).catch(e => console.warn('ZIP削除失敗(続行):', v.zip, e.message))
        );
        checkUrls.push(v.zip);
      }
      if (ext.icon) {
        deletions.push(
          GH.deleteFileSafe(ext.icon, `Delete ${ext.icon}`).catch(e => console.warn('アイコン削除失敗(続行):', ext.icon, e.message))
        );
      }
    }
    updateProgress(`${targets.length}件のファイルを削除中`, '');
    await Promise.all(deletions);

    // extensions.json から削除
    updateProgress('extensions.json更新中', '');
    const idsSet = new Set(ids);
    STATE.data.extensions = STATE.data.extensions.filter(e => !idsSet.has(e.id));
    const msg = targets.length === 1
      ? `Delete extension: ${targets[0].id}`
      : `Delete ${targets.length} extensions`;
    await saveJson(msg);

    // 反映待ち(extensions.jsonから消えるのを確認)
    if (ids.length > 0) {
      await waitForExtensionRemoved(ids, 120);
    }

    updateProgress('完了 - サイトを再読込中...', '');
    alert(`✓ ${targets.length}件削除しました!\nOKを押すとサイトを再読込します。`);
    location.href = location.pathname + '?_=' + Date.now();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

// ===========================================
// GitHubへの保存
// ===========================================
async function uploadFile(path, file, message) {
  const base64 = await fileToBase64(file);
  await GH.putFileSafe(path, base64, message);
}

async function saveJson(message) {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(STATE.data, null, 2) + '\n')));
  await GH.putFileSafe('extensions.json', content, message);
}

// extensions.jsonをサイト経由で取得(キャッシュバスター付き)
async function fetchPublishedJson() {
  try {
    const res = await fetch('extensions.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

// 追加した拡張IDがpublicなextensions.jsonに含まれるまで待機
async function waitForExtensionPublished(expectedIds, timeoutSec = 120) {
  const start = Date.now();
  const deadline = start + timeoutSec * 1000;
  const idSet = new Set(expectedIds);
  while (Date.now() < deadline) {
    const elapsed = Math.floor((Date.now() - start) / 1000);
    updateProgress(`サイト反映を待機中... (${elapsed}秒経過)`, `${expectedIds.length}件の反映を待っています`);
    const json = await fetchPublishedJson();
    if (json && json.extensions) {
      const found = json.extensions.filter(e => idSet.has(e.id)).length;
      if (found === expectedIds.length) return true;
    }
    await new Promise(r => setTimeout(r, 3000));
  }
  return false;
}

// 削除した拡張IDがextensions.jsonから消えるまで待機
async function waitForExtensionRemoved(removedIds, timeoutSec = 120) {
  const start = Date.now();
  const deadline = start + timeoutSec * 1000;
  const idSet = new Set(removedIds);
  while (Date.now() < deadline) {
    const elapsed = Math.floor((Date.now() - start) / 1000);
    updateProgress(`サイト反映を待機中... (${elapsed}秒経過)`, `${removedIds.length}件の削除反映を待っています`);
    const json = await fetchPublishedJson();
    if (json && json.extensions) {
      const stillPresent = json.extensions.filter(e => idSet.has(e.id)).length;
      if (stillPresent === 0) return true;
    }
    await new Promise(r => setTimeout(r, 3000));
  }
  return false;
}

// 旧関数(後方互換用)
async function waitForReflection(checkUrl, timeoutSec = 60) {
  const start = Date.now();
  const deadline = start + timeoutSec * 1000;
  while (Date.now() < deadline) {
    const elapsed = Math.floor((Date.now() - start) / 1000);
    updateProgress(`サイト反映を待機中... (${elapsed}秒経過)`, '');
    try {
      const res = await fetch(checkUrl + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      if (res.ok) return true;
    } catch (e) { /* 続行 */ }
    await new Promise(r => setTimeout(r, 3000));
  }
  return false;
}

async function waitForDeletion(checkUrl, timeoutSec = 60) {
  const start = Date.now();
  const deadline = start + timeoutSec * 1000;
  while (Date.now() < deadline) {
    const elapsed = Math.floor((Date.now() - start) / 1000);
    updateProgress(`削除反映を待機中... (${elapsed}秒経過)`, '');
    try {
      const res = await fetch(checkUrl + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      if (res.status === 404) return true;
    } catch (e) {
      return true;
    }
    await new Promise(r => setTimeout(r, 3000));
  }
  return false;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const result = r.result.split(',')[1];
      resolve(result);
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ===========================================
// ヘルパー
// ===========================================
function requirePat() {
  if (!STATE.pat) {
    alert('まずGitHub PATを入力して保存してください');
    return false;
  }
  return true;
}

function openModal() {
  document.getElementById('modal-backdrop').classList.add('show');
}

function closeModal() {
  if (STATE.busy) return; // 処理中は閉じさせない
  document.getElementById('modal-backdrop').classList.remove('show');
}

function showProgress(text, sub) {
  STATE.busy = true;
  document.body.classList.add('busy');
  document.getElementById('progress-text').textContent = text;
  document.getElementById('progress-sub').textContent = sub;
  document.getElementById('progress-overlay').classList.add('show');
}

function updateProgress(text, sub) {
  document.getElementById('progress-text').textContent = text;
  document.getElementById('progress-sub').textContent = sub;
}

function hideProgress() {
  STATE.busy = false;
  document.body.classList.remove('busy');
  document.getElementById('progress-overlay').classList.remove('show');
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

init();
</script>
