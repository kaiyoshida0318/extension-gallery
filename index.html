<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Extension Gallery</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f7fa;
    --border: #e8e8ee;
    --border-strong: #d8d8e0;
    --text: #1f1f24;
    --text-dim: #6b6b75;
    --text-faint: #9a9aa3;
    --accent: #7c5fd9;
    --accent-hover: #6749c9;
    --accent-soft: #f0ebff;
    --warn-bg: #fff8e1;
    --warn-text: #8a6d00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* === トップバー === */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .logo-img {
    height: 40px;
    width: auto;
    display: block;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .logo-text-1 { color: var(--text); }
  .logo-text-2 { color: var(--accent); }

  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text-faint);
  }

  .version-badge {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 11px;
  }

  /* === メインコンテンツ === */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* === タブ風セクション === */
  .section-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .section-tab {
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    margin-bottom: -1px;
  }

  .section-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .count-badge {
    margin-left: auto;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    align-self: center;
  }

  /* === 検索バー === */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 240px;
    position: relative;
  }

  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.5;
  }

  .search-input {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px 10px 36px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus {
    border-color: var(--accent);
  }

  .search-input::placeholder {
    color: var(--text-faint);
  }

  /* === タグフィルター === */
  .tag-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tag-pill {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tag-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tag-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* === テーブル風カードリスト === */
  .list {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .list-header {
    display: grid;
    grid-template-columns: 56px 1fr 100px 140px;
    padding: 12px 16px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .row {
    display: grid;
    grid-template-columns: 56px 1fr 100px 140px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
  }

  .row:last-child { border-bottom: none; }

  .row:hover {
    background: var(--bg-soft);
  }

  .row-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }

  .row-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .row-main {
    min-width: 0;
    padding-right: 16px;
  }

  .row-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .row-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 6px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .row-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
  }

  .row-version {
    font-size: 12px;
    color: var(--text-dim);
  }

  .row-version-num {
    font-weight: 600;
    color: var(--text);
  }

  .row-date {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .row-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .btn {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    text-align: center;
    font-weight: 500;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }

  /* === モーダル === */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31, 31, 36, 0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-backdrop.show {
    display: flex;
    animation: fadeIn 0.15s;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 540px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-size: 22px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .modal-close:hover {
    background: var(--bg-soft);
    color: var(--text);
  }

  .modal h2 {
    font-size: 18px;
    color: var(--text);
    padding-right: 32px;
    margin-bottom: 4px;
  }

  .modal-version {
    color: var(--text-faint);
    font-size: 12px;
  }

  .modal-body {
    padding: 20px 24px;
  }

  .modal-desc {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .install-steps h3 {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .step {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .step-num {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
  }

  .step-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    padding-top: 1px;
  }

  .step-text code {
    background: var(--bg-soft);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: "SF Mono", Menlo, monospace;
    border: 1px solid var(--border);
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    background: var(--bg-soft);
  }

  /* === 空状態 === */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-faint);
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  /* === レスポンシブ === */
  @media (max-width: 720px) {
    .topbar { padding: 12px 16px; gap: 10px; }
    .logo { font-size: 18px; }
    .container { padding: 16px; }
    .list-header { display: none; }
    .row {
      grid-template-columns: 48px 1fr;
      gap: 12px;
      padding: 14px;
    }
    .row-icon { width: 40px; height: 40px; }
    .row-main { grid-column: 2; padding-right: 0; }
    .row-version, .row-actions {
      grid-column: 1 / -1;
      margin-top: 10px;
    }
    .row-actions { justify-content: flex-start; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="logo-header.png" alt="Extension Gallery" class="logo-img"
       onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo',innerHTML:'<span class=&quot;logo-icon&quot;>🧩</span><span><span class=&quot;logo-text-1&quot;>Extension</span> <span class=&quot;logo-text-2&quot;>Gallery</span></span>'}))">
  <div class="topbar-right">
    <span class="version-badge" id="version-badge">v1.0.0</span>
  </div>
</div>

<div class="container">

  <div class="section-tabs">
    <button class="section-tab active">拡張機能</button>
    <span class="count-badge" id="count-badge">登録: <span id="count-total">0</span>件</span>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" class="search-input" id="search" placeholder="拡張機能名・タグで検索...">
    </div>
  </div>

  <div class="tag-filter" id="tag-filter">
    <button class="tag-pill active" data-tag="all">すべて</button>
  </div>

  <div class="list">
    <div class="list-header">
      <div></div>
      <div>名称 / 説明</div>
      <div>バージョン</div>
      <div style="text-align: right;">アクション</div>
    </div>
    <div id="rows"></div>
  </div>

</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" id="modal-close">×</button>
      <div id="modal-header-content"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
  let DATA = null;
  let ACTIVE_TAG = 'all';
  let SEARCH = '';

  async function loadData() {
    try {
      const res = await fetch('extensions.json');
      DATA = await res.json();
      init();
    } catch (e) {
      document.getElementById('rows').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <p>extensions.json の読み込みに失敗しました</p>
        </div>`;
    }
  }

  function init() {
    document.getElementById('count-total').textContent = DATA.extensions.length;

    const tagSet = new Set();
    DATA.extensions.forEach(e => (e.tags || []).forEach(t => tagSet.add(t)));
    const tagFilter = document.getElementById('tag-filter');
    [...tagSet].sort().forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag-pill';
      btn.dataset.tag = tag;
      btn.textContent = tag;
      tagFilter.appendChild(btn);
    });

    tagFilter.addEventListener('click', e => {
      if (!e.target.classList.contains('tag-pill')) return;
      tagFilter.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      ACTIVE_TAG = e.target.dataset.tag;
      render();
    });

    document.getElementById('search').addEventListener('input', e => {
      SEARCH = e.target.value.toLowerCase();
      render();
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    render();
  }

  function render() {
    const list = document.getElementById('rows');
    const filtered = DATA.extensions.filter(ext => {
      const tagMatch = ACTIVE_TAG === 'all' || (ext.tags || []).includes(ACTIVE_TAG);
      const searchMatch = !SEARCH ||
        ext.name.toLowerCase().includes(SEARCH) ||
        ext.description.toLowerCase().includes(SEARCH) ||
        (ext.tags || []).some(t => t.toLowerCase().includes(SEARCH));
      return tagMatch && searchMatch;
    });

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📭</div>
          <p>該当する拡張機能がありません</p>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(ext => `
      <div class="row">
        <div class="row-icon">
          ${ext.icon ? `<img src="${escapeHtml(ext.icon)}" alt="" onerror="this.parentElement.textContent='🧩'">` : '🧩'}
        </div>
        <div class="row-main">
          <div class="row-name">${escapeHtml(ext.name)}</div>
          <div class="row-desc">${escapeHtml(ext.description)}</div>
          <div class="row-tags">
            ${(ext.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          </div>
        </div>
        <div class="row-version">
          <div class="row-version-num">v${escapeHtml(ext.version)}</div>
          <div class="row-date">${escapeHtml(ext.updated_at)}</div>
        </div>
        <div class="row-actions">
          <button class="btn" onclick="showInstall('${escapeHtml(ext.id)}')">手順</button>
          <a class="btn btn-primary" href="${escapeHtml(ext.zip)}" download>ダウンロード</a>
        </div>
      </div>
    `).join('');
  }

  function showInstall(id) {
    const ext = DATA.extensions.find(e => e.id === id);
    if (!ext) return;
    document.getElementById('modal-header-content').innerHTML = `
      <h2>${escapeHtml(ext.name)}</h2>
      <div class="modal-version">v${escapeHtml(ext.version)} · 最終更新 ${escapeHtml(ext.updated_at)}</div>
    `;
    document.getElementById('modal-body').innerHTML = `
      <p class="modal-desc">${escapeHtml(ext.long_description || ext.description)}</p>
      <div class="install-steps">
        <h3>インストール手順</h3>
        <div class="step"><div class="step-num">1</div><div class="step-text">下の<strong>ダウンロード</strong>ボタンからZIPを取得</div></div>
        <div class="step"><div class="step-num">2</div><div class="step-text">ZIPをダブルクリックして解凍</div></div>
        <div class="step"><div class="step-num">3</div><div class="step-text">Chromeで <code>chrome://extensions</code> を開く</div></div>
        <div class="step"><div class="step-num">4</div><div class="step-text">右上の<strong>デベロッパーモード</strong>をONにする</div></div>
        <div class="step"><div class="step-num">5</div><div class="step-text"><strong>パッケージ化されていない拡張機能を読み込む</strong>から、解凍したフォルダを選択</div></div>
        <div class="step"><div class="step-num">6</div><div class="step-text">ツールバーにアイコンが表示されれば完了</div></div>
      </div>
    `;
    document.getElementById('modal-footer').innerHTML = `
      <button class="btn" onclick="closeModal()">閉じる</button>
      <a class="btn btn-primary" href="${escapeHtml(ext.zip)}" download style="flex: 1;">ダウンロード v${escapeHtml(ext.version)}</a>
    `;
    document.getElementById('modal-backdrop').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('show');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  loadData();
</script>

</body>
</html>
