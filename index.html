<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Extension Gallery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f7fa;
    --border: #e8e8ee;
    --border-strong: #d8d8e0;
    --text: #1f1f24;
    --text-dim: #6b6b75;
    --text-faint: #9a9aa3;
    --accent: #7c5fd9;
    --accent-hover: #6749c9;
    --accent-soft: #f0ebff;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn-bg: #fff8e1;
    --warn-text: #8a6d00;
    --success-bg: #d1fae5;
    --success-text: #065f46;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* === トップバー === */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
  }

  .logo-img {
    height: 40px;
    width: auto;
    display: block;
  }

  .logo-fallback {
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
  }

  .logo-fallback span { color: var(--accent); }

  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text-faint);
  }

  .version-badge {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 11px;
  }

  .admin-actions {
    display: none;
    align-items: center;
    gap: 8px;
  }

  .admin-actions.show { display: flex; }

  .admin-btn {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }

  .admin-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .admin-btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .admin-btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }

  .admin-btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .admin-btn-danger:hover {
    background: #b91c1c;
    border-color: #b91c1c;
    color: #fff;
  }

  .admin-btn-icon {
    padding: 6px 8px;
  }

  .admin-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* === 選択モード時の行 === */
  .row-checkbox {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .row-checkbox input {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  body.select-mode .row {
    cursor: pointer;
  }

  body.select-mode .row.selected {
    background: var(--accent-soft);
  }

  body.select-mode .row-actions {
    opacity: 0.4;
    pointer-events: none;
  }

  /* === メインコンテンツ === */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* === タブ === */
  .section-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    align-items: center;
  }

  .section-tab {
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    margin-bottom: -1px;
  }

  .section-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .count-badge {
    margin-left: auto;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    align-self: center;
  }

  /* === 検索 === */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 240px;
    position: relative;
  }

  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.5;
  }

  .search-input {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px 10px 36px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-faint); }

  /* === タグフィルター === */
  .tag-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tag-pill {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tag-pill:hover { border-color: var(--accent); color: var(--accent); }

  .tag-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* === リスト === */
  .list {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .list-header {
    display: grid;
    grid-template-columns: 56px 1fr 110px 260px;
    gap: 16px;
    padding: 12px 16px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 600;
    letter-spacing: 0.05em;
    transition: grid-template-columns 0.2s;
  }

  .row {
    display: grid;
    grid-template-columns: 56px 1fr 110px 260px;
    gap: 16px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s, grid-template-columns 0.2s;
  }

  /* 選択モード時は先頭にチェックボックス列を追加 */
  body.select-mode .list-header,
  body.select-mode .row {
    grid-template-columns: 36px 56px 1fr 110px 260px;
  }

  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--bg-soft); }

  .row-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }

  .row-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .row-main { min-width: 0; padding-right: 16px; }

  .row-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .row-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 6px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .row-id {
    font-size: 10px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .row-id code {
    font-family: "SF Mono", Menlo, monospace;
    color: var(--text-dim);
    background: var(--bg-soft);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
  }

  .row-tags { display: flex; gap: 4px; flex-wrap: wrap; }

  .tag {
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
  }

  .row-version { font-size: 12px; color: var(--text-dim); }
  .row-version-num { font-weight: 600; color: var(--text); }
  .row-date { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .row-actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
    flex-wrap: nowrap;
  }

  .btn {
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    text-align: center;
    font-weight: 500;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }

  .btn-danger {
    background: #fff;
    border-color: var(--danger-soft);
    color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .btn-icon {
    padding: 6px 7px;
    font-size: 13px;
    min-width: 30px;
  }

  /* === モーダル === */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31, 31, 36, 0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-backdrop.show { display: flex; animation: fadeIn 0.15s; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 600px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-size: 22px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-close:hover {
    background: var(--bg-soft);
    color: var(--text);
  }

  .modal h2 {
    font-size: 18px;
    color: var(--text);
    padding-right: 32px;
    margin-bottom: 4px;
  }

  .modal-version {
    color: var(--text-faint);
    font-size: 12px;
  }

  .modal-body { padding: 20px 24px; }

  .modal-desc {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .modal-section {
    margin-bottom: 20px;
  }

  .modal-section h3 {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* インストール手順 */
  .step {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .step-num {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
  }

  .step-text { color: var(--text); font-size: 13px; line-height: 1.6; padding-top: 1px; }

  .step-text code {
    background: var(--bg-soft);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: "SF Mono", Menlo, monospace;
    border: 1px solid var(--border);
  }

  /* バージョン履歴 */
  .version-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .version-row:last-child { border-bottom: none; }

  .version-label {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    font-family: "SF Mono", Menlo, monospace;
  }

  .version-label.current {
    background: var(--success-bg);
    color: var(--success-text);
  }

  .version-date {
    font-size: 12px;
    color: var(--text-faint);
    flex: 1;
  }

  .version-notes {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* フォーム */
  .form-row {
    margin-bottom: 14px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 600;
  }

  .form-label.required::after {
    content: " *";
    color: var(--danger);
  }

  .form-input, .form-textarea {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
  }

  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }

  .form-textarea {
    resize: vertical;
    min-height: 60px;
    font-family: inherit;
  }

  .form-hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  /* ドロップゾーン */
  .dropzone {
    border: 2px dashed var(--border-strong);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg-soft);
  }

  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .dropzone-icon { font-size: 28px; margin-bottom: 6px; }
  .dropzone-text { font-size: 13px; color: var(--text-dim); }
  .dropzone-text strong { color: var(--accent); }

  .file-info {
    font-size: 12px;
    color: var(--success-text);
    background: var(--success-bg);
    padding: 6px 10px;
    border-radius: 6px;
    margin-top: 8px;
    display: none;
  }

  .file-info.show { display: block; }

  .file-list {
    margin-top: 10px;
  }

  .file-list-header {
    font-size: 12px;
    color: var(--success-text);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .file-list-item {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-soft);
    padding: 6px 10px;
    border-radius: 4px;
    margin-bottom: 4px;
  }

  .file-list-size {
    color: var(--text-faint);
    font-size: 11px;
  }

  .dropzone-hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    background: var(--bg-soft);
  }

  /* 空状態 */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-faint);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* === 進捗オーバーレイ === */
  .progress-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
    cursor: wait;
    user-select: none;
  }

  .progress-overlay.show { display: flex; }

  /* オーバーレイ上に被さってる時のbody全体 */
  body.busy {
    cursor: wait;
  }
  body.busy * {
    pointer-events: none !important;
  }
  body.busy .progress-overlay,
  body.busy .progress-overlay * {
    pointer-events: auto !important;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-text {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }

  .progress-sub {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* === レスポンシブ === */
  @media (max-width: 720px) {
    .topbar { padding: 12px 16px; gap: 10px; }
    .container { padding: 16px; }
    .list-header { display: none; }
    .row {
      grid-template-columns: 48px 1fr;
      gap: 12px;
      padding: 14px;
    }
    .row-icon { width: 40px; height: 40px; }
    .row-main { grid-column: 2; padding-right: 0; }
    .row-version, .row-actions {
      grid-column: 1 / -1;
      margin-top: 10px;
    }
    .row-actions { justify-content: flex-start; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="logo-header.png" alt="Extension Gallery" class="logo-img"
       onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-fallback',innerHTML:'🧩 Extension <span>Gallery</span>'}))">
  <span class="version-badge">v1.3.1</span>
  <div class="topbar-right">
    <div class="admin-actions" id="admin-actions">
      <button class="admin-btn" id="select-mode-btn">☑️ 選択</button>
      <button class="admin-btn admin-btn-danger" id="bulk-delete-btn" style="display:none;">🗑️ <span id="bulk-delete-count">0</span>件削除</button>
      <button class="admin-btn admin-btn-primary" id="add-extension-btn">+ 拡張を追加</button>
      <button class="admin-btn admin-btn-icon" id="settings-btn" title="GitHub認証">⚙️</button>
    </div>
  </div>
</div>

<div class="container">

  <div class="section-tabs">
    <button class="section-tab active">拡張機能</button>
    <span class="count-badge">登録: <span id="count-total">0</span>件</span>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" class="search-input" id="search" placeholder="拡張機能名・タグで検索...">
    </div>
  </div>

  <div class="tag-filter" id="tag-filter">
    <button class="tag-pill active" data-tag="all">すべて</button>
  </div>

  <div class="list">
    <div class="list-header" id="list-header">
      <div></div>
      <div>名称 / 説明</div>
      <div>バージョン</div>
      <div style="text-align: right;">アクション</div>
    </div>
    <div id="rows"></div>
  </div>

</div>

<!-- 共通モーダル -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" id="modal-close">×</button>
      <div id="modal-header-content"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- 進捗オーバーレイ -->
<div class="progress-overlay" id="progress-overlay">
  <div class="spinner"></div>
  <div class="progress-text" id="progress-text">処理中...</div>
  <div class="progress-sub" id="progress-sub"></div>
</div>

<script>
// ===========================================
// グローバル状態
// ===========================================
const STATE = {
  data: null,
  activeTag: 'all',
  search: '',
  isAdmin: false,
  pat: '',
  repoOwner: '',
  repoName: '',
  branch: 'main',
  busy: false,
  selectMode: false,
  selectedIds: new Set()
};

const PAT_KEY = 'ext_gallery_pat';

// ===========================================
// 初期化
// ===========================================
async function init() {
  detectRepo();
  detectAdminMode();
  loadPat();
  await loadData();
  bindEvents();
}

function detectRepo() {
  // GitHub Pagesのホスト名からowner/repo推定
  // 形式: <owner>.github.io/<repo>/
  const host = location.hostname;
  const path = location.pathname.split('/').filter(Boolean);
  const ownerMatch = host.match(/^([^.]+)\.github\.io$/);
  if (ownerMatch) {
    STATE.repoOwner = ownerMatch[1];
    STATE.repoName = path[0] || 'extension-gallery';
  } else {
    STATE.repoOwner = 'kaiyoshida0318';
    STATE.repoName = 'extension-gallery';
  }
}

function detectAdminMode() {
  STATE.isAdmin = true;
  document.getElementById('admin-actions').classList.add('show');
}

function loadPat() {

  const names = ids.map(id => {

// ===========================================
// GitHub API
// ===========================================
const GH = {
  async getFile(path) {
    // キャッシュ回避はURLパラメータのみ(Cache-ControlヘッダはCORSで弾かれる)
    const res = await fetch(`https://api.github.com/repos/${STATE.repoOwner}/${STATE.repoName}/contents/${path}?ref=${STATE.branch}&_=${Date.now()}`, {
      headers: this._headers(),
      cache: 'no-store'
    });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`getFile失敗: ${res.status}`);
    return await res.json();
  },

  async putFile(path, content, message, sha) {
    const body = { message, content, branch: STATE.branch };
    if (sha) body.sha = sha;
    const res = await fetch(`https://api.github.com/repos/${STATE.repoOwner}/${STATE.repoName}/contents/${path}`, {
      method: 'PUT',
      headers: { ...this._headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(`putFile失敗: ${err.message || res.status}`);
    }
    return await res.json();
  },

  // SHA衝突したら自動でSHA取り直して再試行
  async putFileSafe(path, content, message, maxRetry = 2) {
    let lastError;
    for (let i = 0; i < maxRetry; i++) {
      try {
        const existing = await this.getFile(path);
        return await this.putFile(path, content, message, existing ? existing.sha : null);
      } catch (e) {
        lastError = e;
        // SHA不一致のみリトライ
        if (/does not match|409|422/i.test(e.message)) {
          await new Promise(r => setTimeout(r, 300));
          continue;
        }
        throw e;
      }
    }
    throw lastError;
  },

  async deleteFile(path, message, sha) {
    const res = await fetch(`https://api.github.com/repos/${STATE.repoOwner}/${STATE.repoName}/contents/${path}`, {
      method: 'DELETE',
      headers: { ...this._headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, branch: STATE.branch, sha })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(`deleteFile失敗: ${err.message || res.status}`);
    }
    return await res.json();
  },

  // SHA衝突したら自動でSHA取り直して再試行(404は即スキップ)
  async deleteFileSafe(path, message, maxRetry = 2) {
    let lastError;
    for (let i = 0; i < maxRetry; i++) {
      try {
        const existing = await this.getFile(path);
        if (!existing) return null; // 存在しないので終了
        return await this.deleteFile(path, message, existing.sha);
      } catch (e) {
        lastError = e;
        // SHA不一致のみリトライ。404やネットワークエラーは即終了
        if (/does not match|409|422/i.test(e.message)) {
          await new Promise(r => setTimeout(r, 300));
          continue;
        }
        throw e;
      }
    }
    throw lastError;
  },

  _headers() {
    return {
      'Authorization': `token ${STATE.pat}`,
      'Accept': 'application/vnd.github.v3+json'
    };
  }
};

function render() {
  if (!STATE.data) return;
  document.getElementById('count-total').textContent = STATE.data.extensions.length;

}

function renderTagFilter() {
  const tagSet = new Set();
  STATE.data.extensions.forEach(e => (e.tags || []).forEach(t => tagSet.add(t)));
  const tagFilter = document.getElementById('tag-filter');
  // 既存のpillを保持しつつ更新
  const existingTags = new Set([...tagFilter.querySelectorAll('.tag-pill')].map(b => b.dataset.tag));
  [...tagSet].sort().forEach(tag => {
    if (existingTags.has(tag)) return;
    const btn = document.createElement('button');
    btn.className = 'tag-pill';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    tagFilter.appendChild(btn);
  });
}

function renderList() {
  const list = document.getElementById('rows');
  const filtered = STATE.data.extensions.filter(ext => {
    const tagMatch = STATE.activeTag === 'all' || (ext.tags || []).includes(STATE.activeTag);
    const searchMatch = !STATE.search ||
      ext.name.toLowerCase().includes(STATE.search) ||
      ext.description.toLowerCase().includes(STATE.search) ||
      (ext.tags || []).some(t => t.toLowerCase().includes(STATE.search));
    return tagMatch && searchMatch;
  });

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <p>該当する拡張機能がありません</p>
      </div>`;
    return;

  list.innerHTML = filtered.map(ext => {
    const cur = currentVersion(ext);
    const selected = STATE.selectedIds.has(ext.id);
    const adminButtons = STATE.isAdmin ? `
      <button class="btn btn-icon" onclick="event.stopPropagation(); showEditExtension('${esc(ext.id)}')" title="編集">✏️</button>

function bindFormEvents() {
  const dz = document.getElementById('f-dropzone');
  const fi = document.getElementById('f-zip');
  if (dz && fi) {
    dz.addEventListener('click', () => fi.click());
    fi.addEventListener('change', () => showFileList(fi));
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drag');
      if (e.dataTransfer.files.length) {
        fi.files = e.dataTransfer.files;
        showFileList(fi);
      }
    });
  }

  const idz = document.getElementById('f-icondrop');
  const ifi = document.getElementById('f-icon');
  if (idz && ifi) {
    idz.addEventListener('click', () => ifi.click());
    ifi.addEventListener('change', () => showFileInfo(ifi, 'f-iconinfo'));
    idz.addEventListener('dragover', e => { e.preventDefault(); idz.classList.add('drag'); });
    idz.addEventListener('dragleave', () => idz.classList.remove('drag'));
    idz.addEventListener('drop', e => {
      e.preventDefault();
      idz.classList.remove('drag');
      if (e.dataTransfer.files[0]) {
        ifi.files = e.dataTransfer.files;
        showFileInfo(ifi, 'f-iconinfo');
      }
    });
  }
}

function showFileInfo(input, infoId) {
  const f = input.files[0];
  if (!f) return;
  const info = document.getElementById(infoId);
  info.textContent = `✓ ${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
  info.classList.add('show');
}

function showFileList(input) {
  const list = document.getElementById('f-filelist');
  if (!list) return;
  if (input.files.length === 0) {
    list.innerHTML = '';
    return;
  }
  let html = `<div class="file-list-header">${input.files.length}個のファイル:</div>`;
  for (const f of input.files) {
    html += `<div class="file-list-item">✓ ${esc(f.name)} <span class="file-list-size">(${(f.size / 1024).toFixed(1)} KB)</span></div>`;
  }
  list.innerHTML = html;
}

// ===========================================
// 追加/編集の送信
// ===========================================
async function submitAdd() {
  const fileInput = document.getElementById('f-zip');
  const files = Array.from(fileInput.files || []);

  if (files.length === 0) { alert('ZIPファイルを選択してください'); return; }

  try {
    showProgress(`${files.length}個のZIPを処理中`, '');

    const added = [];
    const failed = [];

    for (let i = 0; i < files.length; i++) {
      const zipFile = files[i];
      const prefix = `[${i + 1}/${files.length}] `;
      try {
        updateProgress(`${prefix}ZIPを解析中`, zipFile.name);

        // ZIP内のmanifest.jsonとアイコンを抽出
        const parsed = await parseExtensionZip(zipFile);
        const version = parsed.version || '1.0.0';
        // 名称: manifestのname > ファイル名(拡張子なし)
        const baseName = parsed.name || zipFile.name.replace(/\.zip$/i, '');
        const description = parsed.description || '(説明なし)';
        const baseId = nameToId(baseName) || `ext-${Date.now()}-${i}`;

        // ID衝突回避
        let id = baseId;
        let n = 2;
        while (STATE.data.extensions.find(e => e.id === id) || added.find(e => e.id === id)) {
          id = `${baseId}-${n++}`;
        }

        // ZIPアップロード
        updateProgress(`${prefix}ZIPアップロード中`, `${id}-v${version}.zip`);
        const zipPath = `downloads/${id}-v${version}.zip`;
        await uploadFile(zipPath, zipFile, `Add ${id} v${version}`);

        // アイコンアップロード
        let iconPath = '';
        if (parsed.iconBlob && parsed.iconExt) {
          iconPath = `assets/icons/${id}.${parsed.iconExt}`;
          updateProgress(`${prefix}アイコンアップロード中`, iconPath);
          const iconBase64 = await blobToBase64(parsed.iconBlob);
          await GH.putFileSafe(iconPath, iconBase64, `Add icon for ${id}`);
        }

        // 構造体を追加(jsonへの反映は最後に一括)
        const newExt = {
          id,
          name: baseName,
          description,
          long_description: description,
          tags: [],
          icon: iconPath,
          author: 'Kai',
          permissions_summary: parsed.permissions_summary || '',
          current_version: version,
          versions: [{
            version,
            zip: zipPath,
            updated_at: today(),
            notes: '初回追加'
          }]
        };
        added.push(newExt);
      } catch (err) {
        console.warn('ZIP処理失敗(続行):', zipFile.name, err.message);
        failed.push({ file: zipFile.name, error: err.message });
      }
    }

    // extensions.jsonを一括更新
    if (added.length > 0) {
      updateProgress('extensions.jsonを更新中', `${added.length}件追加`);
      for (const ext of added) STATE.data.extensions.push(ext);
      const msg = added.length === 1
        ? `Add extension: ${added[0].id} v${added[0].current_version}`
        : `Add ${added.length} extensions`;
      await saveJson(msg);
    }

    // 反映待ち
    if (added.length > 0) {
      updateProgress('サイト反映を待機中(最大60秒)', 'GitHub Pagesのビルド完了を待っています');
      await waitForReflection(added[0].versions[0].zip, 60);
    }

    updateProgress('完了 - サイトを再読込中...', '');
    let msg = `✓ ${added.length}個の拡張機能を追加しました!`;
    if (failed.length > 0) {
      msg += `\n\n失敗 ${failed.length}件:\n` + failed.map(f => `- ${f.file}: ${f.error}`).join('\n');
    }
    msg += '\n\nOKを押すとサイトを再読込します。';
    alert(msg);
    location.reload();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

// 名称をIDに変換
// 例: "RMS Login" → "rms-login"
// 例: "楽天商品画像DL" → "dl-1779..." (英数残らない場合はタイムスタンプで補完)
function nameToId(name) {
  if (!name) return '';
  // 英数字・空白・ハイフンだけを残す
  let id = name.toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')   // 英数・空白・ハイフン以外を除去
    .replace(/\s+/g, '-')           // 空白→ハイフン
    .replace(/-+/g, '-')            // 連続ハイフンを1つに
    .replace(/^-|-$/g, '')          // 前後のハイフン除去
    .substring(0, 40);

    // 英数が3文字未満ならフォールバック
  if (id.length < 3) {
    // 残ったものを前にしてタイムスタンプで補完
    const ts = Date.now().toString(36).substring(0, 6);
    id = id ? `${id}-${ts}` : `ext-${ts}`;
  }
  return id;
}

// ZIPからmanifest.jsonとアイコンを抽出
async function parseExtensionZip(zipFile) {
  const result = { id: '', name: '', version: '', description: '', iconBlob: null, iconExt: '', permissions_summary: '' };
  try {
    const zip = await JSZip.loadAsync(zipFile);

    // manifest.jsonを探す(直下優先、サブフォルダも一応探す)
    let manifestEntry = zip.file('manifest.json');
    let manifestPrefix = '';
    if (!manifestEntry) {
      const manifests = Object.keys(zip.files).filter(p => p.endsWith('/manifest.json') || p === 'manifest.json');
      if (manifests.length > 0) {
        manifestEntry = zip.file(manifests[0]);
        manifestPrefix = manifests[0].replace(/manifest\.json$/, '');
      }
    }

    if (manifestEntry) {
      const manifestText = await manifestEntry.async('string');
      const manifest = JSON.parse(manifestText);
      result.version = manifest.version || '';
      result.description = manifest.description || '';
      result.name = manifest.name || '';
      if (manifest.short_name) result.id = nameToId(manifest.short_name);

      if (manifest.permissions || manifest.host_permissions) {
        const all = [...(manifest.permissions || []), ...(manifest.host_permissions || [])];
        result.permissions_summary = all.slice(0, 3).join(', ');
      }

      if (manifest.icons) {
        const sizes = Object.keys(manifest.icons).map(Number).sort((a, b) => b - a);
        for (const size of sizes) {
          const iconRelPath = manifest.icons[String(size)];
          const iconFullPath = manifestPrefix + iconRelPath;
          const iconEntry = zip.file(iconFullPath);
          if (iconEntry) {
            result.iconBlob = await iconEntry.async('blob');
            const ext = iconRelPath.split('.').pop().toLowerCase();
            result.iconExt = (ext === 'jpg' ? 'jpeg' : ext);
            break;
          }
        }
      }
    }
  } catch (e) {
    console.warn('ZIP解析エラー(続行):', e.message);
  }
  return result;
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function submitEdit(id) {
  const data = readForm(true);
  if (!data) return;

  const ext = STATE.data.extensions.find(e => e.id === id);
  if (!ext) return;

  try {
    showProgress('メタ情報を更新中', '');
    ext.name = data.name;
    ext.description = data.description;
    ext.long_description = data.long_description;
    ext.tags = data.tags;
    ext.permissions_summary = data.permissions_summary;
    await saveJson(`Edit metadata: ${id}`);

    updateProgress('完了 - サイトを再読込中...', '');
    alert('✓ 更新完了!\nOKを押すとサイトを再読込します。');
    location.reload();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

async function submitNewVersion(id) {
  const version = document.getElementById('f-version').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const zipFile = document.getElementById('f-zip').files[0];

  if (!version) { alert('バージョン番号を入力してください'); return; }
  if (!zipFile) { alert('ZIPファイルを選択してください'); return; }

  const ext = STATE.data.extensions.find(e => e.id === id);
  if (!ext) return;

  if (ext.versions.find(v => v.version === version)) {
    alert(`v${version} は既に存在します`);
    return;
  }

  try {
    showProgress('新バージョンをアップロード中', `v${version}`);
    const zipPath = `downloads/${id}-v${version}.zip`;
    await uploadFile(zipPath, zipFile, `Add ${id} v${version}`);

    updateProgress('extensions.jsonを更新中', '');
    ext.versions.unshift({
      version,
      zip: zipPath,
      updated_at: today(),
      notes
    });
    ext.current_version = version;
    await saveJson(`Bump ${id} to v${version}`);

    updateProgress('完了 - サイトを再読込中...', `v${version}`);
    alert(`✓ v${version} 追加完了!\nOKを押すとサイトを再読込します。`);
    location.reload();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

function readForm(isEdit) {
  const id = (document.getElementById('f-id').value || '').trim();
  const name = document.getElementById('f-name').value.trim();
  const description = document.getElementById('f-desc').value.trim();
  if (!id || !name || !description) {
    alert('ID・名称・説明は必須です');
    return null;
  }
  if (!/^[a-z0-9-]+$/.test(id)) {
    alert('IDは英小文字・数字・ハイフンのみ');
    return null;
  }
  const data = {
    id, name, description,
    long_description: document.getElementById('f-longdesc').value.trim(),
    tags: document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean),
    permissions_summary: document.getElementById('f-perms').value.trim()
  };
  if (!isEdit) {
    data.version = document.getElementById('f-version').value.trim();
    if (!data.version) { alert('バージョン番号は必須'); return null; }
  }
  return data;
}

// ===========================================
// 削除
// ===========================================
// 単発削除(従来のボタンから)
async function confirmDelete(id) {
  if (!requirePat()) return;
  const ext = STATE.data.extensions.find(e => e.id === id);
  if (!ext) return;
  if (!confirm(`「${ext.name}」を削除しますか?\nZIPファイル・アイコンも一緒に削除されます。`)) return;
  await deleteExtensions([id]);
}

// 複数削除(共通処理)
async function deleteExtensions(ids) {
  if (!requirePat()) return;
  if (ids.length === 0) return;

  try {
    const targets = ids.map(id => STATE.data.extensions.find(e => e.id === id)).filter(Boolean);
    if (targets.length === 0) return;

    showProgress(`${targets.length}件削除中`, targets.map(t => t.name).join(', '));

    // 削除対象URL(後で「消えたか」を確認するため)
    const checkUrls = [];

    // ZIP・アイコンを全て並列削除
    const deletions = [];
    for (const ext of targets) {
      for (const v of ext.versions) {
        deletions.push(
          GH.deleteFileSafe(v.zip, `Delete ${v.zip}`).catch(e => console.warn('ZIP削除失敗(続行):', v.zip, e.message))
        );
        checkUrls.push(v.zip);
      }
      if (ext.icon) {
        deletions.push(
          GH.deleteFileSafe(ext.icon, `Delete ${ext.icon}`).catch(e => console.warn('アイコン削除失敗(続行):', ext.icon, e.message))
        );
      }
    }
    updateProgress(`${targets.length}件のファイルを削除中`, '');
    await Promise.all(deletions);

    // extensions.json から削除
    updateProgress('extensions.json更新中', '');
    const idsSet = new Set(ids);
    STATE.data.extensions = STATE.data.extensions.filter(e => !idsSet.has(e.id));
    const msg = targets.length === 1
      ? `Delete extension: ${targets[0].id}`
      : `Delete ${targets.length} extensions`;
    await saveJson(msg);

    // サイトに反映されるまで待つ(代表的なZIPが404を返すまで)
    if (checkUrls.length > 0) {
      updateProgress('サイト反映を待機中(最大60秒)', 'GitHub Pagesのビルド完了を待っています');
      await waitForDeletion(checkUrls[0], 60);
    }

    updateProgress('完了 - サイトを再読込中...', '');
    alert(`✓ ${targets.length}件削除しました!\nOKを押すとサイトを再読込します。`);
    location.reload();
  } catch (e) {
    hideProgress();
    alert('エラー: ' + e.message);
  }
}

// ===========================================
// GitHubへの保存
// ===========================================
async function uploadFile(path, file, message) {
  const base64 = await fileToBase64(file);
  await GH.putFileSafe(path, base64, message);
}

async function saveJson(message) {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(STATE.data, null, 2) + '\n')));
  await GH.putFileSafe('extensions.json', content, message);
}

// サイトにファイルが反映されるまでpollingで待機(GitHub Pagesのビルドは数秒〜数十秒)
async function waitForReflection(checkUrl, timeoutSec = 60) {
  const start = Date.now();
  const deadline = start + timeoutSec * 1000;
  let attempt = 0;
  while (Date.now() < deadline) {
    attempt++;
    const elapsed = Math.floor((Date.now() - start) / 1000);
    updateProgress(`サイト反映を待機中... (${elapsed}秒経過)`, `${checkUrl} の到達を確認`);
    try {
      const res = await fetch(checkUrl + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      if (res.ok) return true;
    } catch (e) { /* 続行 */ }
    await new Promise(r => setTimeout(r, 3000));
  }
  return false;
}

// 削除が反映されるまで待機(URLが404を返すまで)
async function waitForDeletion(checkUrl, timeoutSec = 60) {
  const start = Date.now();
  const deadline = start + timeoutSec * 1000;
  while (Date.now() < deadline) {
    const elapsed = Math.floor((Date.now() - start) / 1000);
    updateProgress(`削除反映を待機中... (${elapsed}秒経過)`, `${checkUrl}`);
    try {
      const res = await fetch(checkUrl + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      if (res.status === 404) return true;
    } catch (e) {
      return true; // ネットワークエラーは消えたとみなす
    }
    await new Promise(r => setTimeout(r, 3000));
  }
  return false;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const result = r.result.split(',')[1];
      resolve(result);
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ===========================================
// ヘルパー
// ===========================================
function requirePat() {
  if (!STATE.pat) {
    alert('まずGitHub PATを入力して保存してください');
    return false;
  }
  return true;
}

function openModal() {
  document.getElementById('modal-backdrop').classList.add('show');
}

function closeModal() {
  if (STATE.busy) return; // 処理中は閉じさせない
  document.getElementById('modal-backdrop').classList.remove('show');
}

function showProgress(text, sub) {
  STATE.busy = true;
  document.body.classList.add('busy');
  document.getElementById('progress-text').textContent = text;
  document.getElementById('progress-sub').textContent = sub;
  document.getElementById('progress-overlay').classList.add('show');
}

function updateProgress(text, sub) {
  document.getElementById('progress-text').textContent = text;
  document.getElementById('progress-sub').textContent = sub;
}

function hideProgress() {
  STATE.busy = false;
  document.body.classList.remove('busy');
  document.getElementById('progress-overlay').classList.remove('show');
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
