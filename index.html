<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extension Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e0a;
    --bg-elev: #11161a;
    --bg-card: #141b1f;
    --bg-card-hover: #1a2329;
    --border: #1f2a30;
    --border-strong: #2d3d44;
    --text: #d8e3df;
    --text-dim: #8a9994;
    --text-faint: #4d5b58;
    --accent: #7df4a5;
    --accent-dim: #4fb86f;
    --accent-glow: rgba(125, 244, 165, 0.15);
    --danger: #ff7a7a;
    --warn: #f5c25b;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --serif: 'Fraunces', 'Times New Roman', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(125, 244, 165, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(125, 244, 165, 0.03) 0%, transparent 50%);
  }

  /* スキャンライン風背景テクスチャ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(255, 255, 255, 0.008) 3px,
      rgba(255, 255, 255, 0.008) 4px
    );
    z-index: 1;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    position: relative;
    z-index: 2;
  }

  /* === ヘッダー === */
  header {
    padding: 56px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
  }

  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }

  .terminal-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.95;
    color: var(--text);
    margin-bottom: 8px;
  }

  h1 .ampersand {
    color: var(--accent);
    font-style: italic;
    font-weight: 400;
  }

  .subtitle {
    font-family: var(--mono);
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 0.02em;
    margin-bottom: 32px;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    font-size: 12px;
    color: var(--text-faint);
  }

  .meta-row span strong {
    color: var(--text-dim);
    font-weight: 500;
  }

  /* === 検索エリア === */
  .controls {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 280px;
    position: relative;
  }

  .search-box::before {
    content: ">";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 700;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 14px 14px 14px 36px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .search-input:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-input::placeholder {
    color: var(--text-faint);
  }

  .tag-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tag-pill {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 14px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .tag-pill:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .tag-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  /* === 統計バー === */
  .stats-bar {
    display: flex;
    gap: 32px;
    padding: 16px 0;
    border-top: 1px dashed var(--border);
    border-bottom: 1px dashed var(--border);
    margin-bottom: 32px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .stat strong {
    color: var(--accent);
    font-weight: 700;
    margin-right: 6px;
  }

  /* === カードグリッド === */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    margin-bottom: 64px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 24px;
    position: relative;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 0;
    background: var(--accent);
    transition: height 0.25s;
  }

  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-strong);
    transform: translateY(-2px);
  }

  .card:hover::before {
    height: 100%;
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
  }

  .card-icon {
    width: 48px;
    height: 48px;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    flex-shrink: 0;
    border-radius: 2px;
  }

  .card-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-title-wrap {
    flex: 1;
    min-width: 0;
  }

  .card-name {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .card-version {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }

  .card-version .v-tag {
    color: var(--accent-dim);
  }

  .card-desc {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.65;
    margin-bottom: 20px;
    flex: 1;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tag {
    font-size: 10px;
    color: var(--text-faint);
    background: var(--bg-elev);
    padding: 4px 8px;
    border: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  .card-footer {
    display: flex;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    text-align: center;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 700;
  }

  .btn-primary:hover {
    background: #98ffbb;
    border-color: #98ffbb;
    color: var(--bg);
  }

  /* === モーダル === */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  .modal-backdrop.show {
    display: flex;
    animation: fadeIn 0.15s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 32px;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 18px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }

  .modal-close:hover {
    color: var(--text);
  }

  .modal h2 {
    font-family: var(--serif);
    font-size: 28px;
    margin-bottom: 8px;
    color: var(--text);
  }

  .modal-version {
    color: var(--text-faint);
    font-size: 12px;
    margin-bottom: 24px;
  }

  .install-steps {
    margin-top: 24px;
  }

  .install-steps h3 {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
  }

  .step {
    display: flex;
    gap: 16px;
    margin-bottom: 18px;
    padding-left: 4px;
  }

  .step-num {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
  }

  .step-text {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
    padding-top: 4px;
  }

  .step-text code {
    background: var(--bg-card);
    color: var(--accent);
    padding: 2px 6px;
    border: 1px solid var(--border);
    font-size: 12px;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  /* === 空状態 === */
  .empty {
    text-align: center;
    padding: 80px 0;
    color: var(--text-faint);
  }

  .empty-icon {
    font-family: var(--serif);
    font-size: 64px;
    color: var(--text-faint);
    margin-bottom: 16px;
    font-style: italic;
  }

  /* === フッター === */
  footer {
    padding: 32px 0 48px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  footer .ascii-art {
    font-family: var(--mono);
    color: var(--text-faint);
    line-height: 1.2;
    white-space: pre;
  }

  /* === レスポンシブ === */
  @media (max-width: 640px) {
    .container { padding: 0 20px; }
    header { padding: 32px 0 24px; }
    .grid { grid-template-columns: 1fr; }
    .modal { padding: 24px; }
    .stats-bar { flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="terminal-bar">
      <span class="terminal-dot"></span>
      <span>~/extension-gallery — local distribution</span>
    </div>
    <h1>Extension <span class="ampersand">/</span> Gallery</h1>
    <p class="subtitle">社内向け Chrome 拡張機能アーカイブ</p>
    <div class="meta-row">
      <span><strong>maintainer</strong> Kai Yoshida</span>
      <span><strong>updated</strong> <span id="last-updated">—</span></span>
      <span><strong>scope</strong> internal use only</span>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" class="search-input" id="search" placeholder="拡張機能を検索...">
    </div>
  </div>

  <div class="tag-filter" id="tag-filter">
    <button class="tag-pill active" data-tag="all">all</button>
  </div>

  <div class="stats-bar">
    <span class="stat"><strong id="count-visible">0</strong>件 表示中</span>
    <span class="stat"><strong id="count-total">0</strong>件 合計</span>
    <span class="stat"><strong id="latest-update">—</strong>最終更新</span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>© 2026 Extension Gallery / for internal use</span>
    <span class="ascii-art">[ ext-gallery v0.1 ]</span>
  </footer>

</div>

<!-- モーダル -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  // ===== 拡張データ読み込み =====
  let DATA = null;
  let ACTIVE_TAG = 'all';
  let SEARCH = '';

  async function loadData() {
    try {
      const res = await fetch('extensions.json');
      DATA = await res.json();
      init();
    } catch (e) {
      document.getElementById('grid').innerHTML = `
        <div class="empty" style="grid-column: 1/-1;">
          <div class="empty-icon">!</div>
          <p>extensions.json の読み込みに失敗しました</p>
        </div>`;
      console.error(e);
    }
  }

  function init() {
    document.getElementById('count-total').textContent = DATA.extensions.length;

    // 最終更新日
    const dates = DATA.extensions.map(e => e.updated_at).sort();
    const latest = dates[dates.length - 1];
    document.getElementById('last-updated').textContent = latest || '—';
    document.getElementById('latest-update').textContent = latest || '—';

    // タグ一覧抽出
    const tagSet = new Set();
    DATA.extensions.forEach(e => (e.tags || []).forEach(t => tagSet.add(t)));
    const tagFilter = document.getElementById('tag-filter');
    [...tagSet].sort().forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag-pill';
      btn.dataset.tag = tag;
      btn.textContent = tag;
      tagFilter.appendChild(btn);
    });

    // タグクリック
    tagFilter.addEventListener('click', e => {
      if (!e.target.classList.contains('tag-pill')) return;
      tagFilter.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      ACTIVE_TAG = e.target.dataset.tag;
      render();
    });

    // 検索
    document.getElementById('search').addEventListener('input', e => {
      SEARCH = e.target.value.toLowerCase();
      render();
    });

    // モーダル閉じる
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    render();
  }

  function render() {
    const grid = document.getElementById('grid');
    const filtered = DATA.extensions.filter(ext => {
      const tagMatch = ACTIVE_TAG === 'all' || (ext.tags || []).includes(ACTIVE_TAG);
      const searchMatch = !SEARCH ||
        ext.name.toLowerCase().includes(SEARCH) ||
        ext.description.toLowerCase().includes(SEARCH) ||
        (ext.tags || []).some(t => t.toLowerCase().includes(SEARCH));
      return tagMatch && searchMatch;
    });

    document.getElementById('count-visible').textContent = filtered.length;

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty" style="grid-column: 1/-1;">
          <div class="empty-icon">∅</div>
          <p>該当する拡張機能がありません</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map(ext => `
      <div class="card" data-id="${ext.id}">
        <div class="card-header">
          <div class="card-icon">
            ${ext.icon ? `<img src="${ext.icon}" alt="${ext.name}" onerror="this.replaceWith(document.createTextNode('${ext.name[0]}'))">` : ext.name[0]}
          </div>
          <div class="card-title-wrap">
            <div class="card-name">${escapeHtml(ext.name)}</div>
            <div class="card-version"><span class="v-tag">v</span>${ext.version} · ${ext.updated_at}</div>
          </div>
        </div>
        <div class="card-desc">${escapeHtml(ext.description)}</div>
        <div class="card-tags">
          ${(ext.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
        </div>
        <div class="card-footer">
          <button class="btn" onclick="showInstall('${ext.id}')">install →</button>
          <a class="btn btn-primary" href="${ext.zip}" download>download .zip</a>
        </div>
      </div>
    `).join('');
  }

  function showInstall(id) {
    const ext = DATA.extensions.find(e => e.id === id);
    if (!ext) return;
    const modal = document.getElementById('modal-content');
    modal.innerHTML = `
      <h2>${escapeHtml(ext.name)}</h2>
      <div class="modal-version">v${ext.version} · ${ext.updated_at} · ${ext.author || ''}</div>
      <p style="color: var(--text-dim); font-size: 13px; line-height: 1.7;">${escapeHtml(ext.long_description || ext.description)}</p>
      <div class="install-steps">
        <h3>// installation</h3>
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-text">下の <strong>download .zip</strong> ボタンからZIPをダウンロード</div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text">ZIPを解凍する(ダブルクリックでOK)</div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text">Chromeで <code>chrome://extensions</code> を開く</div>
        </div>
        <div class="step">
          <div class="step-num">4</div>
          <div class="step-text">右上の <strong>デベロッパーモード</strong> をオンに切り替え</div>
        </div>
        <div class="step">
          <div class="step-num">5</div>
          <div class="step-text"><strong>パッケージ化されていない拡張機能を読み込む</strong> をクリック → 解凍したフォルダを選択</div>
        </div>
        <div class="step">
          <div class="step-num">6</div>
          <div class="step-text">完了。ツールバーにアイコンが表示されます</div>
        </div>
      </div>
      <div class="modal-actions">
        <a class="btn btn-primary" href="${ext.zip}" download>download v${ext.version} .zip</a>
        <button class="btn" onclick="closeModal()">close</button>
      </div>
    `;
    document.getElementById('modal-backdrop').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('show');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  loadData();
</script>

</body>
</html>
